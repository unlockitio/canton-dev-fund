<circle class="event" cx="108.0" cy="1198.0" r="18.0"/>
<text class="label" x="108.0" y="1184.0">Additional</text>
<text class="label" x="108.0" y="1198.0">capability request</text>
<text class="label" x="108.0" y="1212.0">received</text>
</g>
<g id="DI_Gateway_RequestMerge">
<path class="gateway" d="M208.0,1100.0 L236.0,1128.0 L208.0,1156.0 L180.0,1128.0 Z"/><path d="M199.6,1119.6 L216.4,1136.4 M216.4,1119.6 L199.6,1136.4" stroke="#b45309" stroke-width="2"/>
</g>
