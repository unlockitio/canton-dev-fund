<text class="label" x="1085.0" y="1149.0">with scoped credentials</text>
<path d="M1073.0,1156.0 V1165.0 M1085.0,1156.0 V1165.0 M1097.0,1156.0 V1165.0" fill="none" stroke="#172033" stroke-width="1.5"/>
</g>
