<text class="label" x="519.5" y="250.0">sent</text>
</g>
<g id="DI_Start_Self">
<circle class="event" cx="108.0" cy="358.0" r="18.0"/>
<text class="label" x="108.0" y="351.0">Request own</text>
<text class="label" x="108.0" y="365.0">admission</text>
</g>
<g id="DI_Task_PrepareSelf">
<rect class="task" x="180.0" y="330.0" width="230.0" height="56.0" rx="8"/>
<text class="label" x="295.0" y="351.0">Submit identity, evidence, and</text>
<text class="label" x="295.0" y="365.0">requested capabilities</text>
</g>
<g id="DI_End_SelfRequest">
<circle class="event end" cx="488.0" cy="358.0" r="18.0"/>
<text class="label" x="488.0" y="327.0">Self-request sent</text>
</g>
<g id="DI_Start_Capability">
<circle class="event" cx="108.0" cy="673.0" r="18.0"/>
