<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900" role="img" aria-labelledby="title desc">
<title id="title">02. Veridica Access Lifecycle</title>
<desc id="desc">Exact static rendering of the canonical BPMN DI with four pools, direct activation of already-accepted role capabilities, governed admission and revocation, and unilateral named role renunciation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="none" stroke="#7c3aed"/></marker><marker id="assoc-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.pool{fill:#fff;stroke:#172033;stroke-width:2}.task{fill:#fff;stroke:#2563a8;stroke-width:2}.call{fill:#eef6ff;stroke:#1d4ed8;stroke-width:4}.sub{fill:#f8fbff;stroke:#2563a8;stroke-width:2}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.end{stroke-width:4}.gateway{fill:#fff;stroke:#b45309;stroke-width:2}.data{fill:#fff7d6;stroke:#9a6700;stroke-width:2}.label{font-size:12px;text-anchor:middle}.poollabel{font-size:16px;font-weight:bold}.edge{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:9 6;marker-end:url(#message-arrow)}.assoc{fill:none;stroke:#0f766e;stroke-width:1.5;stroke-dasharray:3 5;marker-end:url(#assoc-arrow)}</style></defs>
<g id="DI_Pool_Governor">
<rect class="pool" x="20.0" y="0.0" width="2360.0" height="270.0"/><line x1="70.0" y1="0.0" x2="70.0" y2="270.0" stroke="#172033" stroke-width="2"/><text class="poollabel" transform="translate(50.0 135.0) rotate(-90)" text-anchor="middle">Governor or Consortium Member</text>
</g>
<g id="DI_Pool_Prospective">
<rect class="pool" x="20.0" y="290.0" width="2360.0" height="300.0"/><line x1="70.0" y1="290.0" x2="70.0" y2="590.0" stroke="#172033" stroke-width="2"/><text class="poollabel" transform="translate(50.0 440.0) rotate(-90)" text-anchor="middle">Prospective Participant</text>
</g>
<g id="DI_Pool_Active">
<rect class="pool" x="20.0" y="610.0" width="2360.0" height="350.0"/><line x1="70.0" y1="610.0" x2="70.0" y2="960.0" stroke="#172033" stroke-width="2"/><text class="poollabel" transform="translate(50.0 785.0) rotate(-90)" text-anchor="middle">Veridica Participant</text>
</g>
<g id="DI_Pool_Operator">
<rect class="pool" x="20.0" y="980.0" width="2360.0" height="900.0"/><line x1="70.0" y1="980.0" x2="70.0" y2="1880.0" stroke="#172033" stroke-width="2"/><text class="poollabel" transform="translate(50.0 1430.0) rotate(-90)" text-anchor="middle">Veridica Operator</text>
</g>
<g id="DI_Start_Sponsor">
<circle class="event" cx="108.0" cy="78.0" r="18.0"/>
<text class="label" x="108.0" y="106.0">Sponsor, offer, or</text>
<text class="label" x="108.0" y="120.0">request admission</text>
</g>
<g id="DI_Task_NameAdmission">
<rect class="task" x="180.0" y="50.0" width="210.0" height="56.0" rx="8"/>
<text class="label" x="285.0" y="71.0">Name candidate and requested</text>
<text class="label" x="285.0" y="85.0">role capabilities</text>
</g>
<g id="DI_End_GovAdmission">
<circle class="event end" cx="468.0" cy="78.0" r="18.0"/>
<text class="label" x="467.5" y="33.0">Admission request</text>
<text class="label" x="467.5" y="47.0">sent</text>
</g>
<g id="Event_0dgx9pm_di">
<circle class="event" cx="108.0" cy="183.0" r="18.0"/><circle cx="108.0" cy="183.0" r="14.0" fill="none" stroke="#0f766e" stroke-width="2"/>
<text class="label" x="108.5" y="211.0">Governed</text>
<text class="label" x="108.5" y="224.0">revocation</text>
<text class="label" x="108.5" y="237.0">requested</text>
</g>
<g id="DI_Task_NameRevocation">
<rect class="task" x="180.0" y="155.0" width="210.0" height="56.0" rx="8"/>
