<text class="label" x="108.0" y="687.0">capability</text>
</g>
<g id="DI_Task_NameCapability">
<rect class="task" x="180.0" y="645.0" width="230.0" height="56.0" rx="8"/>
<text class="label" x="295.0" y="666.0">Name requested role capability</text>
<text class="label" x="295.0" y="680.0">and evidence</text>
</g>
<g id="DI_End_CapabilityRequest">
<circle class="event end" cx="488.0" cy="673.0" r="18.0"/>
<text class="label" x="487.5" y="627.5">Capability request</text>
<text class="label" x="487.5" y="641.5">sent</text>
</g>
<g id="DI_Start_Renounce">
<circle class="event" cx="108.0" cy="819.0" r="18.0"/>
<text class="label" x="108.0" y="853.0">Unilaterally</text>
<text class="label" x="108.0" y="867.0">renounce held role</text>
</g>
<g id="DI_Task_NameRenunciation">
<rect class="task" x="180.0" y="791.0" width="230.0" height="56.0" rx="8"/>
<text class="label" x="295.0" y="812.0">Name held role capability to</text>
<text class="label" x="295.0" y="826.0">renounce</text>
</g>
<g id="DI_End_Renunciation">
<circle class="event end" cx="488.0" cy="819.0" r="18.0"/>
<text class="label" x="540.0" y="746.5">Named renunciation</text>
<text class="label" x="540.0" y="760.5">sent</text>
</g>
<g id="DI_Start_Admission">
<circle class="event" cx="108.0" cy="1058.0" r="18.0"/>
<text class="label" x="108.0" y="1044.0">Sponsored</text>
<text class="label" x="108.0" y="1058.0">admission request</text>
<text class="label" x="108.0" y="1072.0">received</text>
</g>
