<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="790" viewBox="0 0 1580 790" role="img" aria-labelledby="title desc">
  <title id="title">01A Veridica Consortium Formation and Genesis Election</title>
  <desc id="desc">The Genesis Proposer first completes any required Party setup, then proposes the Consortium by defining and committing the Genesis Proposal details, sends every fixed Candidate a genesis proposal and ballot request, Candidates submit their own ballots, and the Genesis Resolver resolves the election.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker>
    <marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b"/></marker>
    <style>.pool{fill:#f8fafc;stroke:#334155;stroke-width:2}.task{fill:#fff;stroke:#2563eb;stroke-width:2}.event{fill:#fff;stroke:#0f766e;stroke-width:3}.gateway{fill:#fef3c7;stroke:#b45309;stroke-width:2}.flow{fill:none;stroke:#334155;stroke-width:1.5;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#arrow)}.assoc{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:4 3;marker-end:url(#open)}.title{font:600 14px sans-serif;fill:#0f172a}.t{font:12px sans-serif;fill:#0f172a}.s{font:10px sans-serif;fill:#334155}.m{font:10px sans-serif;fill:#6d28d9}</style>
  </defs>
  <rect class="pool" x="20" y="30" width="1540" height="220"/><line x1="55" y1="30" x2="55" y2="250" stroke="#334155"/><text class="title" transform="translate(42 220) rotate(-90)">Consortium Lead (Genesis Proposer)</text>
  <rect class="pool" x="20" y="280" width="1540" height="180"/><line x1="55" y1="280" x2="55" y2="460" stroke="#334155"/><text class="title" transform="translate(42 440) rotate(-90)">Fixed Candidate (multi-instance, one per committed Candidate)</text>
  <rect class="pool" x="20" y="490" width="1540" height="270"/><line x1="55" y1="490" x2="55" y2="760" stroke="#334155"/><text class="title" transform="translate(42 720) rotate(-90)">Genesis Resolver</text>
  <circle class="event" cx="118" cy="148" r="18"/><text class="s" x="118" y="178" text-anchor="middle">Start</text>
  <polygon class="gateway" points="228,120 256,148 228,176 200,148"/><path d="M218 138L238 158M238 138L218 158" stroke="#b45309" stroke-width="2"/><text class="s" x="228" y="108" text-anchor="middle">Execution identity requires</text><text class="s" x="228" y="120" text-anchor="middle">Party setup?</text>
  <rect class="task" x="350" y="55" width="170" height="56" rx="8"/><text class="t" x="435" y="80" text-anchor="middle">Create or register</text><text class="t" x="435" y="96" text-anchor="middle">required Party</text>
  <polygon class="gateway" points="558,120 586,148 558,176 530,148"/>
  <rect class="task" x="680" y="110" width="190" height="76" rx="8"/><text class="t" x="775" y="137" text-anchor="middle">Propose Consortium</text><text class="t" x="775" y="153" text-anchor="middle">define Genesis Proposal</text><text class="t" x="775" y="169" text-anchor="middle">details and commit electorate</text>
  <rect class="task" x="1090" y="110" width="190" height="76" rx="8"/><text class="t" x="1185" y="137" text-anchor="middle">Send Genesis Proposal +</text><text class="t" x="1185" y="153" text-anchor="middle">Ballot Request to every</text><text class="t" x="1185" y="169" text-anchor="middle">fixed Candidate</text>
  <circle class="event" cx="1468" cy="148" r="18"/><circle cx="1468" cy="148" r="14" fill="none" stroke="#0f766e"/><text class="s" x="1468" y="178" text-anchor="middle">Proposal delivered</text>
  <path class="flow" d="M136 148H200M228 120V83H350M520 83H558V120M256 148H530M586 148H680M870 148H1090M1280 148H1450"/>
  <text class="s" x="260" y="48" text-anchor="middle">Yes: DecMan Governor Party</text><text class="s" x="260" y="60" text-anchor="middle">or single Consortium Party</text><text class="s" x="392" y="140" text-anchor="middle">No: Use committed Proposer + Candidate Party set</text>
  <path d="M630 45H1030V90H630Z" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M630 45V90" stroke="#64748b" stroke-width="3"/><text class="s" x="645" y="62">Uses the Party Setup result to define and commit the execution identity/model,</text><text class="s" x="645" y="76">decision-policy fields, and fixed closed Candidate electorate.</text><path class="assoc" d="M775 90L775 110"/>
  <path d="M870 200H1090V242H870Z" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M870 200V242" stroke="#64748b" stroke-width="3"/><text class="s" x="882" y="216">Genesis Proposal: execution identity/model,</text><text class="s" x="882" y="230">decision-policy fields, fixed closed Candidate electorate</text><path class="assoc" d="M775 186L950 200"/><path class="assoc" d="M1090 221L1185 186"/>
  <circle class="event" cx="318" cy="368" r="18"/><circle cx="318" cy="368" r="14" fill="none" stroke="#0f766e"/><text class="s" x="318" y="398" text-anchor="middle">Request received</text>
  <rect class="task" x="520" y="340" width="150" height="56" rx="8"/><text class="t" x="595" y="373" text-anchor="middle">Submit own ballot</text>
  <circle class="event" cx="868" cy="368" r="18"/><circle cx="868" cy="368" r="14" fill="none" stroke="#0f766e"/><text class="s" x="868" y="398" text-anchor="middle">Ballot submitted</text>
  <path class="flow" d="M336 368H520M670 368H850"/>
  <circle class="event" cx="118" cy="603" r="18"/><text class="s" x="118" y="633" text-anchor="middle">Start</text>
  <circle class="event" cx="350" cy="603" r="18"/><circle cx="350" cy="603" r="14" fill="none" stroke="#0f766e"/><text class="s" x="350" y="596" text-anchor="middle">Genesis ballot</text><text class="s" x="350" y="608" text-anchor="middle">received</text>
  <rect class="task" x="570" y="565" width="190" height="76" rx="8"/><text class="t" x="665" y="596" text-anchor="middle">Evaluate and resolve</text><text class="t" x="665" y="612" text-anchor="middle">genesis election</text>
  <polygon class="gateway" points="958,575 986,603 958,631 930,603"/><path d="M948 593L968 613M968 593L948 613" stroke="#b45309" stroke-width="2"/><text class="s" x="958" y="563" text-anchor="middle">Genesis election outcome</text>
  <circle class="event" cx="1128" cy="538" r="18"/><circle cx="1128" cy="538" r="14" fill="none" stroke="#0f766e"/><text class="s" x="1155" y="542">Consortium formed</text>
  <circle class="event" cx="1128" cy="603" r="18"/><circle cx="1128" cy="603" r="14" fill="none" stroke="#0f766e"/><text class="s" x="1155" y="607">VRejected</text>
  <circle class="event" cx="1128" cy="668" r="18"/><circle cx="1128" cy="668" r="14" fill="none" stroke="#0f766e"/><text class="s" x="1155" y="672">VExpired</text>
  <path class="flow" d="M136 603H332M368 603H570M760 603H930M958 575V538H1110M986 603H1110M958 631V668H1110"/>
  <path class="message" d="M1185 186V260H318V350"/><text class="m" x="752" y="252" text-anchor="middle">Genesis Proposal + Ballot Request</text>
  <path class="message" d="M868 386V500H350V585"/><text class="m" x="600" y="492" text-anchor="middle">Genesis ballot submitted</text>
</svg>
