<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 2680" width="2500" height="2680" role="img" aria-labelledby="title desc">
<title id="title">01B Veridica Consortium Governance</title><desc id="desc">Five-pool governance collaboration. Cross-pool message flows connect message events: message starts instantiate Governor, Proposer revision, Stakeholder, Resolver, and Executor lifecycles; withdrawal interrupts active Governor review.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><style>.pool{fill:#fff;stroke:#0f172a;stroke-width:2}.task{fill:#fff;stroke:#1d4ed8;stroke-width:1.6}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.end{stroke-width:4}.gateway{fill:#fff7ed;stroke:#c2410c;stroke-width:1.6}.flow{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:7 4;marker-end:url(#message-arrow)}.t{font:12px sans-serif;fill:#0f172a}.s{font:10.5px sans-serif;fill:#334155}.poolname{font:bold 14px sans-serif;fill:#0f172a}.label{font:10px sans-serif;fill:#5b21b6}</style></defs>
<g id="DI_Proposer"><rect class="pool" x="20" y="20" width="2460" height="600"/><text class="poolname" x="32" y="45">Proposer</text></g><g id="DI_Governor"><rect class="pool" x="20" y="700" width="2460" height="450"/><text class="poolname" x="32" y="725">Governor</text></g><g id="DI_Stakeholder"><rect class="pool" x="20" y="1230" width="2460" height="300"/><text class="poolname" x="32" y="1255">Relevant Stakeholder</text><text class="s" x="32" y="1270">one per policy-defined stakeholder</text></g><g id="DI_Resolver"><rect class="pool" x="20" y="1610" width="2460" height="470"/><text class="poolname" x="32" y="1635">Resolver</text></g><g id="DI_Executor"><rect class="pool" x="20" y="2160" width="2460" height="480"/><text class="poolname" x="32" y="2185">Executor set</text></g>
<path id="DI_MF_Proposal" class="message" d="M1094,146L1094,650L98,650L98,790"/><text class="label" x="470" y="640">Committed Governance Proposal</text><path id="DI_MF_Withdrawal" class="message" d="M434,366L434,680L2460,680L2460,900L294,900"/><text class="label" x="1260" y="670">Governance Proposal withdrawal</text><path id="DI_MF_Revision" class="message" d="M766,1022L766,1170L78,1170L78,488L100,488"/><text class="label" x="300" y="1160">Governance Proposal revision request</text><path id="DI_MF_BallotRequest" class="message" d="M766,822L766,1210L158,1210L158,1338L136,1338"/><text class="label" x="300" y="1225">Governance Proposal + Ballot Request</text><path id="DI_MF_Ballot" class="message" d="M430,1352L430,1570L118,1570L118,1700"/><text class="label" x="300" y="1560">Stakeholder ballot</text><path id="DI_MF_Outcome" class="message" d="M766,1732L766,2120L118,2120L118,2250"/><text class="label" x="300" y="2110">Approved GovernanceOutcome</text>
<g id="DI_Start_Action"><circle class="event" cx="118" cy="128" r="18"/><text class="s" x="75" y="170">Action requested</text></g><g id="DI_Task_ValidateCapacity"><rect class="task" x="196" y="100" width="160" height="56" rx="8"/><text class="t" x="230" y="133">Validate capacity</text></g><g id="DI_Task_Define"><rect class="task" x="416" y="100" width="160" height="56" rx="8"/><text class="t" x="436" y="125">Define Governance</text><text class="t" x="466" y="141">Proposal</text></g><g id="DI_Task_Commit"><rect class="task" x="636" y="100" width="160" height="56" rx="8"/><text class="t" x="656" y="125">Commit Governance</text><text class="t" x="686" y="141">Proposal</text></g><g id="DI_Task_Deliver"><rect class="task" x="856" y="100" width="160" height="56" rx="8"/><text class="t" x="873" y="133">Deliver proposal</text></g><g id="DI_End_ProposalSent"><circle class="event end" cx="1094" cy="128" r="18"/><text class="s" x="1044" y="170">Proposal sent</text></g>
<g id="DI_Start_Withdraw"><circle class="event" cx="118" cy="348" r="18"/><text class="s" x="72" y="390">Withdrawal requested</text></g><g id="DI_Task_Withdraw"><rect class="task" x="196" y="320" width="160" height="56" rx="8"/><text class="t" x="216" y="353">Withdraw proposal</text></g><g id="DI_End_WithdrawalSent"><circle class="event end" cx="434" cy="348" r="18"/><text class="s" x="390" y="390">Withdrawal sent</text></g>
<g id="DI_Start_Revision"><circle class="event" cx="118" cy="488" r="18"/><text class="s" x="55" y="530">Revision request received</text></g><g id="DI_Task_RevisionValidate"><rect class="task" x="196" y="460" width="160" height="56" rx="8"/><text class="t" x="216" y="485">Validate capacity</text></g><g id="DI_Task_RevisionDefine"><rect class="task" x="416" y="460" width="160" height="56" rx="8"/><text class="t" x="436" y="485">Define new proposal</text></g><g id="DI_Task_RevisionCommit"><rect class="task" x="636" y="460" width="160" height="56" rx="8"/><text class="t" x="656" y="485">Commit new proposal</text></g><g id="DI_Task_RevisionDeliver"><rect class="task" x="856" y="460" width="160" height="56" rx="8"/><text class="t" x="876" y="493">Deliver new proposal</text></g><g id="DI_End_RevisionDelivered"><circle class="event end" cx="1094" cy="488" r="18"/></g>
<g id="DI_Start_Proposal"><circle class="event" cx="98" cy="808" r="18"/><text class="s" x="58" y="870">Committed proposal received</text></g><g id="DI_Gateway_ReviewOrWithdrawal"><polygon class="gateway" points="164,780 192,808 164,836 136,808"/><text class="s" x="82" y="860">Review completed or withdrawal?</text></g><g id="DI_Catch_ReviewCompleted"><circle class="event" cx="110" cy="900" r="18"/><text class="s" x="60" y="932">Review completed</text></g><g id="DI_Catch_Withdrawal"><circle class="event" cx="276" cy="900" r="18"/><text class="s" x="229" y="932">Withdrawal received</text></g><g id="DI_Task_Review"><rect class="task" x="196" y="780" width="160" height="56" rx="8"/><text class="t" x="220" y="813">Review committed proposal</text></g><g id="DI_End_Withdrawn"><circle class="event end" cx="416" cy="910" r="14"/></g><g id="DI_Gateway_Approved"><polygon class="gateway" points="444,780 472,808 444,836 416,808"/></g><g id="DI_Task_Distribute"><rect class="task" x="532" y="770" width="160" height="76" rx="8"/><text class="t" x="548" y="805">Distribute proposal +</text><text class="t" x="562" y="821">Ballot Request</text></g><g id="DI_End_BallotRequestSent"><circle class="event end" cx="766" cy="808" r="14"/><text class="s" x="714" y="770">Request sent</text></g><g id="DI_Task_RequestRevision"><rect class="task" x="532" y="980" width="160" height="56" rx="8"/><text class="t" x="550" y="1013">Request revision</text></g><g id="DI_End_RevisionRequestSent"><circle class="event end" cx="766" cy="1008" r="14"/><text class="s" x="708" y="1040">Request sent</text></g>
<g id="DI_Start_BallotRequest"><circle class="event" cx="118" cy="1338" r="18"/><text class="s" x="46" y="1380">Ballot request received</text></g><g id="DI_Task_SubmitBallot"><rect class="task" x="196" y="1310" width="160" height="56" rx="8"/><text class="t" x="226" y="1343">Submit ballot</text></g><g id="DI_End_BallotSent"><circle class="event end" cx="430" cy="1338" r="14"/><text class="s" x="392" y="1300">Ballot sent</text></g>
<g id="DI_Start_Ballot"><circle class="event" cx="118" cy="1718" r="18"/><text class="s" x="48" y="1760">Applicable governance</text><text class="s" x="65" y="1776">rule satisfied</text></g><g id="DI_Task_Resolve"><rect class="task" x="196" y="1690" width="160" height="56" rx="8"/><text class="t" x="214" y="1715">Evaluate and resolve</text><text class="t" x="208" y="1731">Governance Proposal</text></g><g id="DI_Gateway_Verdict"><polygon class="gateway" points="444,1690 472,1718 444,1746 416,1718"/></g><g id="DI_Task_CreateOutcome"><rect class="task" x="532" y="1682" width="160" height="72" rx="8"/><text class="t" x="540" y="1718">Create GovernanceOutcome</text></g><g id="DI_End_OutcomeSent"><circle class="event end" cx="766" cy="1718" r="14"/><text class="s" x="712" y="1680">Outcome sent</text></g><g id="DI_End_Rejected"><circle class="event end" cx="546" cy="1888" r="14"/></g><g id="DI_End_Lapsed"><circle class="event end" cx="766" cy="1888" r="14"/></g><g id="DI_Annotation_ApplicableGovernanceRule"><path d="M860,1660 H850 V1756 H860" fill="none" stroke="#334155" stroke-width="1.5"/><text class="s" x="870" y="1677">The applicable governance rule may vary by case, including</text><text class="s" x="870" y="1694">quorum, voting weight, timeout, delegation, or abstention</text><text class="s" x="870" y="1711">handling. These variations are intentionally not defined here.</text></g><path id="DI_Assoc_ApplicableGovernanceRule" d="M118,1700 L118,1640 L850,1640 L850,1660" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<g id="DI_Start_Outcome"><circle class="event" cx="118" cy="2268" r="18"/><text class="s" x="48" y="2310">Approved outcome received</text></g><g id="DI_Task_ValidateExecution"><rect class="task" x="196" y="2240" width="160" height="56" rx="8"/><text class="t" x="211" y="2265">Validate executable</text><text class="t" x="238" y="2281">outcome</text></g><g id="DI_Gateway_Execute"><polygon class="gateway" points="444,2240 472,2268 444,2296 416,2268"/></g><g id="DI_Task_Execute"><rect class="task" x="532" y="2240" width="160" height="56" rx="8"/><text class="t" x="552" y="2273">Execute GovernanceOutcome</text></g><g id="DI_End_Executed"><circle class="event end" cx="766" cy="2268" r="14"/></g><g id="DI_End_Expired"><circle class="event end" cx="546" cy="2438" r="14"/></g>
