<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">02B Veridica Aggregator Actions</title>
<desc id="desc">Four-pool collaboration. Aggregator Party pool (multiplicity 1..999) starts on Aggregator_Authorized from the 02 chassis (external). The aggregator publishes the privacy-safe availability record, applies exact or semantic matching, does manual review, invites the 02c verifier (mutually exclusive role, external), assesses confidence, receives Input_Ready from the input Contributor Party (multiplicity 1..999, external), selects eligible authorized input versions, normalizes under a named versioned method, handles outliers/missing data/recency/minimum independence, calculates aggregate confidence and traceability, excludes or revises, waits via an event-based gateway for Review_Complete or Correction_Received from the 02c verifier, and publishes the aggregate. Veridica Platform records the published aggregate. Exactly one boundary message catch exists, on the aggregator calculate-confidence task, for governance suspension during in-flight aggregation. Verification requests direct exclusively to the 02c verifier pool. Aggregator and verifier are mutually exclusive roles. No message flow reaches 06 Reward Allocation or Process_AllocationEffector.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><style>.pool{fill:#fff;stroke:#0f172a;stroke-width:2}.external-pool{fill:#f8fafc;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 3}.task{fill:#fff;stroke:#1d4ed8;stroke-width:1.6}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.boundary{fill:#fff;stroke:#b91c1c;stroke-width:2}.end{stroke-width:4}.flow{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:7 4;marker-end:url(#message-arrow)}.t{font:11px sans-serif;fill:#0f172a}.s{font:10px sans-serif;fill:#334155}.poolname{font:bold 14px sans-serif;fill:#0f172a}.label{font:10px sans-serif;fill:#5b21b6}</style></defs>
<g id="DI_Chassis_External_02b"><rect class="external-pool" x="20" y="20" width="1540" height="60"/><text class="poolname" x="32" y="42">Participant lifecycle chassis (02, external source of Aggregator_Authorized)</text></g>
<g id="DI_Verifier_External"><rect class="external-pool" x="20" y="100" width="1540" height="60"/><text class="poolname" x="32" y="122">Verifier Party (02c, exclusive verifier role, mutually exclusive with 02b aggregator)</text></g>
<g id="DI_VeridicaPlatform_02b"><rect class="pool" x="20" y="180" width="1540" height="160"/><text class="poolname" x="32" y="202">Veridica Platform</text></g>
<g id="DI_VP_AggregatePublishedReceived"><circle class="event" cx="138" cy="258" r="18"/><text class="s" x="80" y="294">Aggregate_Published received</text></g>
<g id="DI_VP_RecordAggregate"><rect class="task" x="220" y="230" width="220" height="56" rx="8"/><text class="t" x="228" y="250">Record aggregate in catalog</text><text class="t" x="232" y="264">under access, pricing, and</text><text class="t" x="252" y="278">licensing controls</text></g>
<g id="DI_VP_End"><circle class="event end" cx="498" cy="258" r="18"/><text class="s" x="440" y="294">Aggregate available</text></g>
<g id="DI_Participant_Process_AggregatorParty"><rect class="pool" x="20" y="360" width="1540" height="560"/><text class="poolname" x="32" y="382">Aggregator Party (multiplicity 1..999)</text></g>
<g id="DI_AG_Authorized"><circle class="event" cx="138" cy="458" r="18"/><text class="s" x="78" y="494">Aggregator_Authorized received</text></g>
<g id="DI_AG_PublishAvailability"><rect class="task" x="220" y="410" width="200" height="46" rx="8"/><text class="t" x="228" y="430">Publish privacy-safe</text><text class="t" x="236" y="446">availability record</text></g>
<g id="DI_AG_ApplyMatching"><rect class="task" x="220" y="466" width="200" height="46" rx="8"/><text class="t" x="232" y="486">Apply exact or semantic</text><text class="t" x="252" y="502">matching policy</text></g>
<g id="DI_AG_ManualReview"><rect class="task" x="220" y="522" width="200" height="46" rx="8"/><text class="t" x="232" y="542">Manual review or</text><text class="t" x="248" y="558">keep separate</text></g>
<g id="DI_AG_InviteVerifier"><rect class="task" x="460" y="410" width="200" height="46" rx="8"/><text class="t" x="472" y="430">Invite eligible independent</text><text class="t" x="488" y="446">verifier (02c, mutually exclusive)</text></g>
<g id="DI_AG_VerificationRequestSent"><circle class="event end" cx="718" cy="438" r="18"/><text class="s" x="658" y="474">Verification_Request sent to 02c</text></g>
<g id="DI_AG_AssessConfidence"><rect class="task" x="460" y="466" width="200" height="46" rx="8"/><text class="t" x="472" y="486">Assess confidence from</text><text class="t" x="480" y="502">policy, evidence, independence</text></g>
<g id="DI_AG_InputReadyReceived"><circle class="event" cx="718" cy="494" r="18"/><text class="s" x="658" y="530">Input_Ready received</text></g>
<g id="DI_AG_InputRequestedSent"><circle class="event end" cx="718" cy="540" r="18"/><text class="s" x="658" y="576">Input_Requested sent</text></g>
<g id="DI_AG_SelectInputVersions"><rect class="task" x="780" y="410" width="200" height="46" rx="8"/><text class="t" x="790" y="430">Select eligible authorized</text><text class="t" x="820" y="446">input versions</text></g>
<g id="DI_AG_Normalize"><rect class="task" x="780" y="466" width="200" height="46" rx="8"/><text class="t" x="796" y="486">Normalize under named</text><text class="t" x="816" y="502">versioned method</text></g>
<g id="DI_AG_HandleOutliers"><rect class="task" x="780" y="522" width="200" height="46" rx="8"/><text class="t" x="792" y="542">Handle outliers, missing data,</text><text class="t" x="800" y="558">recency, min independence</text></g>
<g id="DI_AG_CalculateConfidence"><rect class="task" x="1020" y="410" width="200" height="46" rx="8"/><text class="t" x="1032" y="430">Calculate aggregate</text><text class="t" x="1052" y="446">confidence and traceability</text></g>
<g id="DI_AG_ExcludeOrRevise"><rect class="task" x="1020" y="466" width="200" height="46" rx="8"/><text class="t" x="1032" y="486">Exclude input, revise method,</text><text class="t" x="1056" y="502">or request evidence</text></g>
<g id="DI_AG_WaitForReview"><polygon class="gateway" points="1076,540 1104,568 1076,596 1048,568" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><circle cx="1076" cy="568" r="14" fill="none" stroke="#b45309" stroke-width="2"/><text class="s" x="1000" y="524" text-anchor="middle">Wait for Review_Complete</text><text class="s" x="1010" y="538" text-anchor="middle">or Correction_Received</text></g>
<g id="DI_AG_ReviewCompleteReceived"><circle class="event" cx="1158" cy="548" r="18"/><text class="s" x="1098" y="584">Review_Complete received</text></g>
<g id="DI_AG_CorrectionReceived"><circle class="event" cx="1158" cy="598" r="18"/><text class="s" x="1098" y="634">Correction_Received</text></g>
<g id="DI_AG_PublishAggregate"><rect class="task" x="1220" y="540" width="200" height="46" rx="8"/><text class="t" x="1232" y="560">Publish aggregate under</text><text class="t" x="1240" y="576">access, pricing, licensing</text></g>
<g id="DI_AG_AggregatePublishedSent"><circle class="event end" cx="1478" cy="568" r="18"/><text class="s" x="1418" y="604">Aggregate_Published sent</text></g>
<g id="DI_AG_GovernanceInterruption"><circle class="boundary" cx="1110" cy="398" r="18"/><text class="s" x="1048" y="364">Governance suspension</text><text class="s" x="1052" y="378">during in-flight aggregation</text></g>
<g id="DI_AG_ApplyInterruption"><rect class="task" x="1020" y="660" width="200" height="46" rx="8"/><text class="t" x="1040" y="680">Apply governance</text><text class="t" x="1064" y="696">suspension</text></g>
<g id="DI_AG_Suspended"><circle class="event end" cx="1278" cy="683" r="18"/><text class="s" x="1218" y="719">Aggregator suspended by governance</text></g>
<g id="DI_AG_End"><circle class="event end" cx="1558" cy="568" r="18"/><text class="s" x="1498" y="604">Aggregation round complete</text></g>
<g id="DI_Participant_Process_InputContributorParty"><rect class="pool" x="20" y="940" width="1540" height="160"/><text class="poolname" x="32" y="962">Contributor Party as input source (multiplicity 1..999)</text></g>
<g id="DI_IC_InputRequested"><circle class="event" cx="138" cy="1018" r="18"/><text class="s" x="78" y="1054">Input_Requested received</text></g>
<g id="DI_IC_PrepareInput"><rect class="task" x="220" y="990" width="200" height="56" rx="8"/><text class="t" x="232" y="1010">Prepare eligible input</text><text class="t" x="248" y="1024">data and evidence</text></g>
<g id="DI_IC_InputReadySent"><circle class="event end" cx="478" cy="1018" r="18"/><text class="s" x="418" y="1054">Input_Ready sent</text></g>
<g id="DI_IC_End"><circle class="event end" cx="558" cy="1018" r="18"/><text class="s" x="498" y="1054">Input delivered</text></g>
