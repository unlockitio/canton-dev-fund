<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">02A Veridica Contributor Actions</title>
<desc id="desc">Two-pool collaboration. Contributor Party pool (multiplicity 1..999) starts on Contributor_Authorized issued by the 02 chassis (external). The contributor selects standard version and Observation Key policy, submits a contribution (Contribution_Submit to Veridica Platform), then waits via an event-based gateway for Evidence_Request, Challenge, or Correction. The third task responds to any of the three, handling both initial and correction responses via the contract version of the submission it receives (no exclusive gateway branching on initial versus correction). The Veridica Platform routes responses through one exclusive gateway (evidence request, challenge, or correction) and catches the resulting Contribution_Respond. Exactly one boundary message catch exists, on the contributor Submit task, used for governance suspension or rotation arriving mid-submission. No message flow reaches 06 Reward Allocation or Process_AllocationEffector.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><style>.pool{fill:#fff;stroke:#0f172a;stroke-width:2}.external-pool{fill:#f8fafc;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 3}.task{fill:#fff;stroke:#1d4ed8;stroke-width:1.6}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.boundary{fill:#fff;stroke:#b91c1c;stroke-width:2}.end{stroke-width:4}.flow{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:7 4;marker-end:url(#message-arrow)}.t{font:12px sans-serif;fill:#0f172a}.s{font:10.5px sans-serif;fill:#334155}.poolname{font:bold 14px sans-serif;fill:#0f172a}.label{font:10px sans-serif;fill:#5b21b6}</style></defs>
<g id="DI_Chassis_External"><rect class="external-pool" x="20" y="20" width="1540" height="80"/><text class="poolname" x="32" y="45">Participant lifecycle chassis (02, external source of Contributor_Authorized)</text></g>
<g id="DI_VeridicaPlatform_02a"><rect class="pool" x="20" y="120" width="1540" height="440"/><text class="poolname" x="32" y="145">Veridica Platform</text></g>
<g id="DI_Participant_Process_ContributorParty_02a"><rect class="pool" x="20" y="580" width="1540" height="420"/><text class="poolname" x="32" y="605">Contributor Party (multiplicity 1..999)</text></g>
<g id="DI_VP_SubmissionReceived"><circle class="event" cx="138" cy="278" r="18"/><text class="s" x="98" y="314">Submission received</text></g>
<g id="DI_VP_ProcessSubmission"><rect class="task" x="220" y="250" width="180" height="56" rx="8"/><text class="t" x="228" y="270">Process contribution:</text><text class="t" x="232" y="284">validate standard version,</text><text class="t" x="236" y="298">Observation Key, and evidence</text></g>
<g id="DI_VP_ResponseDecision"><polygon class="gateway" points="516,250 544,278 516,306 488,278" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text class="s" x="440" y="244" text-anchor="middle">Response type</text></g>
<g id="DI_VP_RequestEvidence"><rect class="task" x="580" y="170" width="180" height="56" rx="8"/><text class="t" x="592" y="194">Request additional evidence</text><text class="t" x="602" y="210">from contributor</text></g>
<g id="DI_VP_EvidenceRequestSent"><circle class="event end" cx="838" cy="198" r="18"/><text class="s" x="778" y="236">Evidence request sent</text></g>
<g id="DI_VP_Challenge"><rect class="task" x="580" y="250" width="180" height="56" rx="8"/><text class="t" x="598" y="274">Raise challenge against</text><text class="t" x="612" y="290">contribution</text></g>
<g id="DI_VP_ChallengeSent"><circle class="event end" cx="838" cy="278" r="18"/><text class="s" x="788" y="314">Challenge sent</text></g>
<g id="DI_VP_RequestCorrection"><rect class="task" x="580" y="330" width="180" height="56" rx="8"/><text class="t" x="592" y="354">Request correction of</text><text class="t" x="616" y="370">submission</text></g>
<g id="DI_VP_CorrectionSent"><circle class="event end" cx="838" cy="358" r="18"/><text class="s" x="778" y="396">Correction request sent</text></g>
<g id="DI_VP_ResponseReceived"><circle class="event" cx="938" cy="278" r="18"/><text class="s" x="898" y="314">Response received</text></g>
<g id="DI_VP_ProcessResponse"><rect class="task" x="1000" y="250" width="200" height="56" rx="8"/><text class="t" x="1008" y="270">Process response:</text><text class="t" x="1012" y="284">update evidence,</text><text class="t" x="1012" y="298">challenge resolution, correction</text></g>
<g id="DI_VP_End"><circle class="event end" cx="1258" cy="278" r="18"/><text class="s" x="1198" y="314">Contribution round complete</text></g>
<g id="DI_CT_Authorized"><circle class="event" cx="138" cy="718" r="18"/><text class="s" x="78" y="754">Contributor_Authorized received</text></g>
<g id="DI_CT_SelectPolicy"><rect class="task" x="220" y="690" width="200" height="56" rx="8"/><text class="t" x="228" y="710">Select standard version</text><text class="t" x="232" y="724">and Observation Key policy</text></g>
<g id="DI_CT_Submit"><rect class="task" x="460" y="690" width="220" height="56" rx="8"/><text class="t" x="468" y="710">Submit Contribution ID,</text><text class="t" x="472" y="724">information or reference,</text><text class="t" x="510" y="738">and evidence</text></g>
<g id="DI_CT_ContributionSubmitSent"><circle class="event end" cx="738" cy="718" r="18"/><text class="s" x="678" y="754">Contribution_Submit sent</text></g>
<g id="DI_CT_WaitForResponse"><polygon class="gateway" points="876,690 904,718 876,746 848,718" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><circle cx="876" cy="718" r="14" fill="none" stroke="#b45309" stroke-width="2"/><text class="s" x="800" y="684" text-anchor="middle">Wait for Evidence_Request,</text><text class="s" x="816" y="698" text-anchor="middle">Challenge, or Correction</text></g>
<g id="DI_CT_EvidenceRequestReceived"><circle class="event" cx="938" cy="648" r="18"/><text class="s" x="878" y="684">Evidence_Request received</text></g>
<g id="DI_CT_ChallengeReceived"><circle class="event" cx="938" cy="718" r="18"/><text class="s" x="888" y="754">Challenge received</text></g>
<g id="DI_CT_CorrectionReceived"><circle class="event" cx="938" cy="768" r="18"/><text class="s" x="888" y="804">Correction received</text></g>
<g id="DI_CT_Respond"><rect class="task" x="1020" y="690" width="240" height="56" rx="8"/><text class="t" x="1028" y="710">Respond to evidence request,</text><text class="t" x="1032" y="724">challenge, or correction</text><text class="t" x="1034" y="738">(initial and correction via contract version)</text></g>
<g id="DI_CT_ContributionRespondSent"><circle class="event end" cx="1318" cy="718" r="18"/><text class="s" x="1258" y="754">Contribution_Respond sent</text></g>
<g id="DI_CT_GovernanceInterruption"><circle class="boundary" cx="550" cy="778" r="18"/><text class="s" x="488" y="814">Governance suspension or rotation</text><text class="s" x="500" y="828">arriving mid-submission</text></g>
<g id="DI_CT_ApplyInterruption"><rect class="task" x="460" y="830" width="220" height="56" rx="8"/><text class="t" x="472" y="854">Apply governance suspension</text><text class="t" x="492" y="870">or rotation</text></g>
<g id="DI_CT_Interrupted"><circle class="event end" cx="738" cy="858" r="18"/><text class="s" x="678" y="894">Contributor suspended or rotated by governance</text></g>
<g id="DI_CT_End"><circle class="event end" cx="1398" cy="718" r="18"/><text class="s" x="1338" y="754">Contribution submission complete</text></g>
<path id="DI_VP1" class="flow" d="M156,278L220,278"/><path id="DI_VP2" class="flow" d="M400,278L460,278"/><path id="DI_VP3" class="flow" d="M488,250L488,198L580,198"/><path id="DI_VP3a" class="flow" d="M760,198L820,198"/><path id="DI_VP4" class="flow" d="M516,278L580,278"/><path id="DI_VP4a" class="flow" d="M760,278L820,278"/><path id="DI_VP5" class="flow" d="M488,306L488,358L580,358"/><path id="DI_VP5a" class="flow" d="M760,358L820,358"/><path id="DI_VP6" class="flow" d="M856,198L920,198L920,260"/><path id="DI_VP7" class="flow" d="M956,278L1000,278"/><path id="DI_VP8" class="flow" d="M1200,278L1240,278"/><path id="DI_VP_R1" class="flow" d="M856,278L920,278"/><path id="DI_VP_R2" class="flow" d="M856,358L920,358L920,296"/>
<path id="DI_CT1" class="flow" d="M156,718L220,718"/><path id="DI_CT2" class="flow" d="M420,718L460,718"/><path id="DI_CT3" class="flow" d="M680,718L720,718"/><path id="DI_CT4" class="flow" d="M756,718L820,718"/><path id="DI_CT5" class="flow" d="M848,690L848,648L920,648"/><path id="DI_CT6" class="flow" d="M876,718L920,718"/><path id="DI_CT7" class="flow" d="M848,746L848,768L920,768"/><path id="DI_CT8" class="flow" d="M956,718L1020,718"/><path id="DI_CT9" class="flow" d="M1260,718L1300,718"/><path id="DI_CT10" class="flow" d="M1336,718L1380,718"/><path id="DI_CT_BI1" class="flow" d="M550,796L550,830"/><path id="DI_CT_BI2" class="flow" d="M680,858L720,858"/>
<path id="DI_MF_ContributorAuthorized" class="message" d="M80,100L80,570L138,570L138,700"/><text class="label" x="20" y="565">Contributor_Authorized</text>
<path id="DI_MF_ContributionSubmit" class="message" d="M738,700L738,570L138,570L138,260"/><text class="label" x="200" y="555">Contribution_Submit</text>
<path id="DI_MF_ContributionRespond" class="message" d="M1318,700L1318,540L958,540L958,296"/><text class="label" x="900" y="525">Contribution_Respond</text>
<path id="DI_MF_EvidenceRequest" class="message" d="M838,180L838,540L938,540L938,630"/><text class="label" x="780" y="525">Evidence_Request</text>
<path id="DI_MF_Challenge" class="message" d="M838,260L838,520L938,520L938,690"/><text class="label" x="780" y="505">Challenge</text>
<path id="DI_MF_Correction" class="message" d="M838,340L838,500L938,500L938,750"/><text class="label" x="780" y="485">Correction</text>
<path id="DI_MF_GovernanceInterruption" class="message" d="M100,100L100,540L550,540L550,760"/><text class="label" x="20" y="535">Governance suspension or rotation</text>
</svg>
