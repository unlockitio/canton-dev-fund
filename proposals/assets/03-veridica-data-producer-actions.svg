<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="840" viewBox="0 0 1980 840" role="img" aria-labelledby="title desc">
  <title id="title">03 Veridica Data Producer Actions</title>
  <desc id="desc">Contribution versions are independently validated, matched, corrected and revalidated when needed, aggregated into a consolidated contribution, and published without aggregate verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .lane{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.lane-label{font:700 18px system-ui,sans-serif;fill:#0f172a}.task{fill:#fff;stroke:#2563eb;stroke-width:2;rx:8}.task-text{font:600 14px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.event{fill:#fff;stroke:#0f766e;stroke-width:3}.event-end{fill:#fff;stroke:#0f766e;stroke-width:5}.gateway{fill:#fff;stroke:#7c3aed;stroke-width:2}.gateway-mark{fill:none;stroke:#7c3aed;stroke-width:2}.note{fill:#fffbea;stroke:#a16207;stroke-width:1.5}.note-text{font:12px system-ui,sans-serif;fill:#422006}.assoc{fill:none;stroke:#a16207;stroke-width:1.5;stroke-dasharray:5 4}.handoff{font:11px system-ui,sans-serif;fill:#475569}.heading{font:700 24px system-ui,sans-serif;fill:#0f172a}.subtitle{font:14px system-ui,sans-serif;fill:#475569}.gateway-label{font:600 12px system-ui,sans-serif;fill:#4c1d95;text-anchor:middle}
    </style>
  </defs>
  <text class="heading" x="20" y="30">03 Veridica Data Producer Actions</text>
  <text class="subtitle" x="20" y="52">Individual contribution validation, correction and revalidation, matching, consolidation, and publication</text>

  <rect class="lane" x="20" y="70" width="1940" height="230"/><rect class="lane" x="20" y="300" width="1940" height="300"/><rect class="lane" x="20" y="600" width="1940" height="220"/>
  <text class="lane-label" x="34" y="98">Contributor</text><text class="lane-label" x="34" y="328">Aggregator</text><text class="lane-label" x="34" y="628">Verifier</text>

  <circle class="event" cx="115" cy="165" r="18"/><text class="handoff" x="72" y="204">Authorized</text>
  <rect class="task" x="175" y="125" width="180" height="80"/><text class="task-text" x="265" y="158"><tspan x="265">Submit contribution</tspan><tspan x="265" dy="19">version</tspan></text>
  <rect class="task" x="425" y="645" width="210" height="80"/><text class="task-text" x="530" y="669"><tspan x="530">Validate and attest</tspan><tspan x="530" dy="18">individual contribution</tspan><tspan x="530" dy="18">version</tspan></text>
  <rect class="task" x="715" y="350" width="180" height="80"/><text class="task-text" x="805" y="382"><tspan x="805">Match</tspan><tspan x="805" dy="19">contributions</tspan></text>
  <polygon class="gateway" points="995,365 1020,390 995,415 970,390"/><path class="gateway-mark" d="M987 382 L1003 398 M1003 382 L987 398"/><text class="gateway-label" x="995" y="348">Correction needed?</text>
  <rect class="task" x="915" y="485" width="160" height="70"/><text class="task-text" x="995" y="514"><tspan x="995">Request</tspan><tspan x="995" dy="19">correction</tspan></text>
  <rect class="task" x="1160" y="340" width="270" height="100"/><text class="task-text" x="1295" y="371"><tspan x="1295">Aggregate matched contributions</tspan><tspan x="1295" dy="19">into consolidated</tspan><tspan x="1295" dy="19">contribution</tspan></text>
  <rect class="task" x="1530" y="350" width="210" height="80"/><text class="task-text" x="1635" y="382"><tspan x="1635">Publish consolidated</tspan><tspan x="1635" dy="19">contribution</tspan></text>
  <circle class="event-end" cx="1848" cy="390" r="18"/>

  <path class="flow" d="M133 165 H175"/><path class="flow" d="M355 165 H390 V685 H425"/><path class="flow" d="M635 685 H675 V390 H715"/><path class="flow" d="M895 390 H970"/>
  <path class="flow" d="M995 415 V485"/><path class="flow" d="M915 520 H870 V310 H420 V105 H265 V125"/><path class="flow" d="M1020 390 H1160"/><path class="flow" d="M1430 390 H1530"/><path class="flow" d="M1740 390 H1830"/>
  <text class="handoff" x="360" y="150">Contribution version + evidence</text><text class="handoff" x="640" y="670">Current attestation</text><text class="handoff" x="1007" y="465">Yes: mismatch or relevant issue</text><text class="handoff" x="500" y="301">Superseding version returns for new validation</text><text class="handoff" x="1060" y="380">No: matched</text>

  <rect class="note" x="165" y="220" width="250" height="60"/><text class="note-text" x="175" y="238"><tspan x="175">Contribution ID, Observation Key, standard</tspan><tspan x="175" dy="15">and policy versions, provenance, evidence,</tspan><tspan x="175" dy="15">and any corrects or replaces reference.</tspan></text><path class="assoc" d="M265 205 V220"/>
  <rect class="note" x="385" y="745" width="290" height="60"/><text class="note-text" x="395" y="763"><tspan x="395">Verifier attests individual versions only. Every</tspan><tspan x="395" dy="15">corrected version needs a new attestation before</tspan><tspan x="395" dy="15">matching. No aggregate review or verification.</tspan></text><path class="assoc" d="M530 725 V745"/>
  <rect class="note" x="680" y="455" width="220" height="105"/><text class="note-text" x="690" y="473"><tspan x="690">Apply the named versioned exact</tspan><tspan x="690" dy="15">or semantic Matching Policy.</tspan><tspan x="690" dy="15">Mismatch, ambiguity, stale validation,</tspan><tspan x="690" dy="15">or another relevant issue takes the</tspan><tspan x="690" dy="15">correction route. Only matched,</tspan><tspan x="690" dy="15">current contributions proceed.</tspan></text><path class="assoc" d="M805 430 V455"/>
  <rect class="note" x="910" y="620" width="315" height="105"/><text class="note-text" x="920" y="638"><tspan x="920">Correction supersedes and links to the prior version.</tspan><tspan x="920" dy="15">Preserve its linked prior verification as visible evidence</tspan><tspan x="920" dy="15">marked “not current / revalidation required”. The corrected</tspan><tspan x="920" dy="15">version returns through submission and receives a new</tspan><tspan x="920" dy="15">validation or attestation before matching and aggregation.</tspan></text><path class="assoc" d="M995 555 V620"/>
  <rect class="note" x="1170" y="475" width="285" height="95"/><text class="note-text" x="1180" y="493"><tspan x="1180">Normalize matched versions under the named</tspan><tspan x="1180" dy="15">Information Standard and Aggregation Policy;</tspan><tspan x="1180" dy="15">apply governed calculation and confidence rules;</tspan><tspan x="1180" dy="15">preserve traceability in the consolidated</tspan><tspan x="1180" dy="15">contribution. No Verifier aggregate task occurs.</tspan></text><path class="assoc" d="M1295 440 V475"/>
  <rect class="note" x="1515" y="475" width="245" height="80"/><text class="note-text" x="1525" y="493"><tspan x="1525">Publish under applicable access,</tspan><tspan x="1525" dy="15">pricing, and licensing controls.</tspan><tspan x="1525" dy="15">No aggregate verification and no handoff</tspan><tspan x="1525" dy="15">to Workflow 05 reward allocation.</tspan></text><path class="assoc" d="M1635 430 V475"/>
</svg>
