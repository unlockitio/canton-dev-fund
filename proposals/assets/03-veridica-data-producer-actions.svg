<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1050" viewBox="0 0 2160 1050" role="img" aria-labelledby="title desc">
  <title id="title">03 Veridica Data Producer Actions</title>
  <desc id="desc">Contributor, Aggregator, and Verifier collaborate through explicit messages. Every initial or corrected contribution is independently delivered to Aggregator and Verifier, and the consolidated artifact is verified.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="message-arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M1,1 L10,4 L1,7 z" fill="none" stroke="#0369a1" stroke-width="1.3"/></marker>
    <style>
      .pool{fill:#f8fafc;stroke:#475569;stroke-width:2}.pool-label{font:700 18px system-ui,sans-serif;fill:#0f172a}.task{fill:#fff;stroke:#2563eb;stroke-width:2;rx:8}.task-text{font:600 13px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.message{fill:none;stroke:#0369a1;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#message-arrow)}.event{fill:#fff;stroke:#0f766e;stroke-width:3}.event-end{fill:#fff;stroke:#0f766e;stroke-width:5}.gateway{fill:#fff;stroke:#7c3aed;stroke-width:2}.gateway-mark{fill:none;stroke:#7c3aed;stroke-width:2}.note{fill:#fffbea;stroke:#a16207;stroke-width:1.5}.note-text{font:12px system-ui,sans-serif;fill:#422006}.assoc{fill:none;stroke:#a16207;stroke-width:1.5;stroke-dasharray:5 4}.label{font:11px system-ui,sans-serif;fill:#334155}.message-label{font:600 11px system-ui,sans-serif;fill:#075985}.heading{font:700 24px system-ui,sans-serif;fill:#0f172a}.subtitle{font:14px system-ui,sans-serif;fill:#475569}.gateway-label{font:600 12px system-ui,sans-serif;fill:#4c1d95;text-anchor:middle}
    </style>
  </defs>
  <text class="heading" x="20" y="30">03 Veridica Data Producer Actions</text>
  <text class="subtitle" x="20" y="52">Three participant pools, explicit independent deliveries, correction and fresh validation, consolidation, and artifact verification</text>

  <rect class="pool" x="40" y="60" width="2080" height="330"/><rect class="pool" x="40" y="420" width="2080" height="300"/><rect class="pool" x="40" y="750" width="2080" height="300"/>
  <text class="pool-label" x="55" y="88">Contributor</text><text class="pool-label" x="55" y="448">Aggregator</text><text class="pool-label" x="55" y="778">Verifier</text>

  <circle class="event" cx="118" cy="143" r="18"/><text class="label" x="88" y="175">Ready</text>
  <rect class="task" x="175" y="105" width="150" height="76"/><text class="task-text" x="250" y="139"><tspan x="250">Submit</tspan><tspan x="250" dy="18">contribution</tspan></text>
  <polygon class="gateway" points="390,118 415,143 390,168 365,143"/><path class="gateway-mark" d="M378 143 H402 M390 131 V155"/><text class="gateway-label" x="390" y="105">Two deliveries</text>
  <circle class="event" cx="488" cy="103" r="18"/><path d="M478 97h20v12h-20z M478 97l10 7 10-7" fill="none" stroke="#0f766e"/><text class="label" x="445" y="76">To Aggregator</text>
  <circle class="event" cx="488" cy="193" r="18"/><path d="M478 187h20v12h-20z M478 187l10 7 10-7" fill="none" stroke="#0f766e"/><text class="label" x="449" y="225">To Verifier</text>
  <path class="flow" d="M136 143 H175"/><path class="flow" d="M325 143 H365"/><path class="flow" d="M390 118 V103 H470"/><path class="flow" d="M390 168 V193 H470"/>
  <rect class="note" x="535" y="80" width="350" height="110"/><text class="note-text" x="547" y="99"><tspan x="547">Each version carries IDs, governed standard and policy</tspan><tspan x="547" dy="16">versions, provenance, evidence, and replacement links.</tspan><tspan x="547" dy="16">Two explicit message throws deliver independently to</tspan><tspan x="547" dy="16">Aggregator and Verifier. This is not a broadcast.</tspan></text><path class="assoc" d="M325 120 H535"/>

  <circle class="event" cx="838" cy="278" r="18"/><path d="M828 272h20v12h-20z M828 272l10 7 10-7" fill="none" stroke="#0f766e"/><text class="label" x="786" y="250">Correction catch</text>
  <rect class="task" x="900" y="240" width="190" height="76"/><text class="task-text" x="995" y="274"><tspan x="995">Resolve/correct</tspan><tspan x="995" dy="18">contribution</tspan></text>
  <rect class="task" x="1140" y="240" width="190" height="76"/><text class="task-text" x="1235" y="274"><tspan x="1235">Submit superseding</tspan><tspan x="1235" dy="18">version</tspan></text>
  <polygon class="gateway" points="1405,253 1430,278 1405,303 1380,278"/><path class="gateway-mark" d="M1393 278h24 M1405 266v24"/><text class="gateway-label" x="1405" y="238">Repeat both</text>
  <circle class="event" cx="1508" cy="238" r="18"/><path d="M1498 232h20v12h-20z M1498 232l10 7 10-7" fill="none" stroke="#0f766e"/>
  <circle class="event" cx="1508" cy="328" r="18"/><path d="M1498 322h20v12h-20z M1498 322l10 7 10-7" fill="none" stroke="#0f766e"/>
  <path class="flow" d="M856 278 H900"/><path class="flow" d="M1090 278 H1140"/><path class="flow" d="M1330 278 H1380"/><path class="flow" d="M1405 253 V238 H1490"/><path class="flow" d="M1405 303 V328 H1490"/>
  <rect class="note" x="1600" y="220" width="445" height="110"/><text class="note-text" x="1612" y="239"><tspan x="1612">Correction preserves the old version and linked verification as</tspan><tspan x="1612" dy="16">prior-version evidence marked “not current / revalidation required”.</tspan><tspan x="1612" dy="16">The superseding version repeats both deliveries and requires fresh</tspan><tspan x="1612" dy="16">validation before it can be used.</tspan></text><path class="assoc" d="M1090 278 H1600"/>

  <circle class="event" cx="118" cy="523" r="18"/><circle class="event" cx="208" cy="523" r="18"/><path d="M198 517h20v12h-20z M198 517l10 7 10-7" fill="none" stroke="#0f766e"/>
  <circle class="event" cx="268" cy="523" r="18"/><path d="M258 517h20v12h-20z M258 517l10 7 10-7" fill="none" stroke="#0f766e"/><text class="label" x="238" y="558">Validation result</text>
  <polygon class="gateway" points="335,498 360,523 335,548 310,523"/><path class="gateway-mark" d="M327 515l16 16 M343 515l-16 16"/><text class="gateway-label" x="335" y="480">Validation accepted?</text>
  <rect class="task" x="380" y="485" width="110" height="76"/><text class="task-text" x="435" y="518"><tspan x="435">Match</tspan><tspan x="435" dy="18">contributions</tspan></text>
  <polygon class="gateway" points="525,498 550,523 525,548 500,523"/><path class="gateway-mark" d="M517 515l16 16 M533 515l-16 16"/><text class="gateway-label" x="525" y="482">Correction needed?</text>
  <rect class="task" x="610" y="590" width="180" height="76"/><text class="task-text" x="700" y="623"><tspan x="700">Initiate</tspan><tspan x="700" dy="18">correction flow</tspan></text>
  <circle class="event" cx="858" cy="628" r="18"/><path d="M848 622h20v12h-20z M848 622l10 7 10-7" fill="none" stroke="#0f766e"/><text class="label" x="815" y="674">Correction request</text>
  <rect class="task" x="650" y="475" width="270" height="96"/><text class="task-text" x="785" y="510"><tspan x="785">Aggregate contributions into</tspan><tspan x="785" dy="18">consolidated contribution</tspan></text>
  <circle class="event" cx="998" cy="523" r="18"/><path d="M988 517h20v12h-20z M988 517l10 7 10-7" fill="none" stroke="#0f766e"/><text class="label" x="944" y="558">Send consolidated</text>
  <path class="flow" d="M136 523 H190"/><path class="flow" d="M226 523 H250"/><path class="flow" d="M286 523 H310"/><path class="flow" d="M360 523 H380"/><path class="flow" d="M490 523 H500"/><path class="flow" d="M335 548 V680 H590 V628 H610"/><path class="flow" d="M525 548 V628 H610"/><path class="flow" d="M550 523 H650"/><path class="flow" d="M790 628 H840"/><path class="flow" d="M920 523 H980"/>
  <text class="label" x="365" y="512">Accepted/current</text><text class="label" x="350" y="675">Rejected, conflicted, or stale</text><text class="label" x="542" y="595">Yes</text><text class="label" x="575" y="512">No</text>
  <rect class="note" x="1080" y="455" width="400" height="95"/><text class="note-text" x="1092" y="474"><tspan x="1092">Matching applies the named versioned policy. Mismatch, ambiguity,</tspan><tspan x="1092" dy="16">stale validation, or another relevant issue takes correction.</tspan><tspan x="1092" dy="16">Only current versions with fresh validation may be used.</tspan></text><path class="assoc" d="M435 485 V460 H1080"/>
  <rect class="note" x="1520" y="455" width="470" height="95"/><text class="note-text" x="1532" y="474"><tspan x="1532">Aggregation applies the named Information Standard and Aggregation</tspan><tspan x="1532" dy="16">Policy, governed calculation and confidence rules, and preserves</tspan><tspan x="1532" dy="16">traceability in the consolidated artifact and its evidence.</tspan></text><path class="assoc" d="M785 571 V680 H1520 V550"/>

  <circle class="event" cx="118" cy="833" r="18"/><circle class="event" cx="208" cy="833" r="18"/><path d="M198 827h20v12h-20z M198 827l10 7 10-7" fill="none" stroke="#0f766e"/>
  <rect class="task" x="280" y="795" width="200" height="76"/><text class="task-text" x="380" y="829"><tspan x="380">Validate contribution</tspan><tspan x="380" dy="18">version and evidence</tspan></text><circle class="event-end" cx="548" cy="833" r="18"/>
  <path class="flow" d="M136 833 H190"/><path class="flow" d="M226 833 H280"/><path class="flow" d="M480 833 H530"/>
  <circle class="event" cx="778" cy="943" r="18"/><circle class="event" cx="868" cy="943" r="18"/><path d="M858 937h20v12h-20z M858 937l10 7 10-7" fill="none" stroke="#0f766e"/>
  <rect class="task" x="940" y="905" width="230" height="76"/><text class="task-text" x="1055" y="939"><tspan x="1055">Verify consolidated</tspan><tspan x="1055" dy="18">contribution</tspan></text><circle class="event-end" cx="1238" cy="943" r="18"/>
  <path class="flow" d="M796 943 H850"/><path class="flow" d="M886 943 H940"/><path class="flow" d="M1170 943 H1220"/>
  <rect class="note" x="1320" y="805" width="690" height="105"/><text class="note-text" x="1332" y="824"><tspan x="1332">Verifier validation examines each received artifact and its evidence. Corrected versions require fresh validation.</tspan><tspan x="1332" dy="16">Consolidated verification examines the consolidated artifact, evidence, traceability, and applicable rules.</tspan><tspan x="1332" dy="16">It never evaluates the Aggregator’s work, performance, or method. No flow reaches Workflow 05.</tspan></text><path class="assoc" d="M1170 943 H1280 V857 H1320"/>

  <path class="message" d="M488 121 V400 H208 V505"/><text class="message-label" x="255" y="394">Initial version to Aggregator</text>
  <path class="message" d="M488 211 V735 H208 V815"/><text class="message-label" x="255" y="729">Initial version to Verifier</text>
  <path class="message" d="M1508 256 V405 H240 V523 H226"/><text class="message-label" x="1120" y="399">Superseding version to Aggregator</text>
  <path class="message" d="M1508 346 V740 H240 V833 H226"/><text class="message-label" x="1120" y="734">Superseding version to Verifier for fresh validation</text>
  <path class="message" d="M548 815 V735 H268 V541"/><text class="message-label" x="290" y="729">Current validation for exact version</text>
  <path class="message" d="M858 610 V575 H810 V278 H820"/><text class="message-label" x="815" y="404">Correction request</text>
  <path class="message" d="M998 541 V735 H868 V925"/><text class="message-label" x="1010" y="730">Consolidated artifact and evidence</text>
</svg>
