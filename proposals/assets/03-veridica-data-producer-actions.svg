<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="820" viewBox="0 0 1720 820" role="img" aria-labelledby="title desc">
  <title id="title">03 Veridica Data Producer Actions</title>
  <desc id="desc">Happy-path choreography across Contributor, Aggregator, and independent Verifier lanes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .lane{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.lane-label{font:700 18px system-ui,sans-serif;fill:#0f172a}.task{fill:#fff;stroke:#2563eb;stroke-width:2;rx:8}.task-text{font:600 14px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.event{fill:#fff;stroke:#0f766e;stroke-width:3}.event-end{fill:#fff;stroke:#0f766e;stroke-width:5}.note{fill:#fffbea;stroke:#a16207;stroke-width:1.5}.note-text{font:12px system-ui,sans-serif;fill:#422006}.assoc{fill:none;stroke:#a16207;stroke-width:1.5;stroke-dasharray:5 4}.handoff{font:11px system-ui,sans-serif;fill:#475569}.heading{font:700 24px system-ui,sans-serif;fill:#0f172a}.subtitle{font:14px system-ui,sans-serif;fill:#475569}
    </style>
  </defs>
  <text class="heading" x="20" y="30">03 Veridica Data Producer Actions</text>
  <text class="subtitle" x="20" y="52">Focused happy path with one meaningful task per lane at each handoff</text>

  <rect class="lane" x="20" y="70" width="1680" height="210"/><rect class="lane" x="20" y="280" width="1680" height="260"/><rect class="lane" x="20" y="540" width="1680" height="250"/>
  <text class="lane-label" x="34" y="98">Contributor</text><text class="lane-label" x="34" y="308">Aggregator</text><text class="lane-label" x="34" y="568">Verifier</text>

  <circle class="event" cx="115" cy="165" r="18"/><text class="handoff" x="72" y="204">Authorized</text>
  <rect class="task" x="175" y="125" width="175" height="80"/><text class="task-text" x="262" y="158"><tspan x="262">Submit contribution</tspan><tspan x="262" dy="19">package</tspan></text>
  <rect class="task" x="420" y="595" width="185" height="80"/><text class="task-text" x="512" y="628"><tspan x="512">Validate and attest</tspan><tspan x="512" dy="19">contribution</tspan></text>
  <rect class="task" x="665" y="335" width="185" height="80"/><text class="task-text" x="757" y="368"><tspan x="757">Prepare aggregation</tspan><tspan x="757" dy="19">round</tspan></text>
  <rect class="task" x="910" y="125" width="175" height="80"/><text class="task-text" x="997" y="158"><tspan x="997">Provide eligible</tspan><tspan x="997" dy="19">input</tspan></text>
  <rect class="task" x="1150" y="335" width="185" height="80"/><text class="task-text" x="1242" y="368"><tspan x="1242">Build traceable</tspan><tspan x="1242" dy="19">aggregate</tspan></text>
  <rect class="task" x="1390" y="595" width="185" height="80"/><text class="task-text" x="1482" y="628"><tspan x="1482">Independently review</tspan><tspan x="1482" dy="19">aggregate</tspan></text>
  <rect class="task" x="1575" y="335" width="105" height="80"/><text class="task-text" x="1627" y="359"><tspan x="1627">Publish</tspan><tspan x="1627" dy="18">reviewed</tspan><tspan x="1627" dy="18">aggregate</tspan></text>
  <circle class="event-end" cx="1680" cy="305" r="18"/>

  <path class="flow" d="M133 165 H175"/><path class="flow" d="M350 165 H385 V635 H420"/><path class="flow" d="M605 635 H635 V375 H665"/><path class="flow" d="M850 375 H880 V165 H910"/><path class="flow" d="M1085 165 H1120 V375 H1150"/><path class="flow" d="M1335 375 H1360 V635 H1390"/><path class="flow" d="M1575 635 H1560 V375 H1575"/><path class="flow" d="M1627 335 V305 H1662"/>
  <text class="handoff" x="356" y="150">Contribution + evidence</text><text class="handoff" x="610" y="620">Attestation</text><text class="handoff" x="855" y="360">Input request</text><text class="handoff" x="1090" y="150">Authorized input</text><text class="handoff" x="1340" y="360">Review request</text><text class="handoff" x="1578" y="620">Completed review</text>

  <rect class="note" x="165" y="220" width="205" height="48"/><text class="note-text" x="175" y="238"><tspan x="175">Versioned policy, Contribution ID,</tspan><tspan x="175" dy="15">provenance, evidence, contract version.</tspan></text><path class="assoc" d="M262 205 V220"/>
  <rect class="note" x="385" y="700" width="255" height="72"/><text class="note-text" x="395" y="718"><tspan x="395">Independent validation, conflict checks,</tspan><tspan x="395" dy="15">and accountable attestation. Review</tspan><tspan x="395" dy="15">exceptions stay outside this happy path;</tspan><tspan x="395" dy="15">corrections preserve history and reasons.</tspan></text><path class="assoc" d="M512 675 V700"/>
  <rect class="note" x="635" y="440" width="245" height="76"/><text class="note-text" x="645" y="458"><tspan x="645">Privacy-safe availability, named versioned</tspan><tspan x="645" dy="15">Matching Policy, independent Verifier, and</tspan><tspan x="645" dy="15">input request. Review ambiguous matches</tspan><tspan x="645" dy="15">or keep separate. Matching proves no truth.</tspan></text><path class="assoc" d="M757 415 V440"/>
  <rect class="note" x="1110" y="440" width="265" height="76"/><text class="note-text" x="1120" y="458"><tspan x="1120">Versioned inputs, Information Standard, and</tspan><tspan x="1120" dy="15">Aggregation Policy; outliers, missing data,</tspan><tspan x="1120" dy="15">recency, minimum independence, policy-based</tspan><tspan x="1120" dy="15">confidence, and traceability.</tspan></text><path class="assoc" d="M1242 415 V440"/>
  <rect class="note" x="1355" y="700" width="255" height="72"/><text class="note-text" x="1365" y="718"><tspan x="1365">Validate method, inputs, independence,</tspan><tspan x="1365" dy="15">evidence, and confidence. Record review</tspan><tspan x="1365" dy="15">with limitations. No truth, reward, or</tspan><tspan x="1365" dy="15">governance outcome is guaranteed.</tspan></text><path class="assoc" d="M1482 675 V700"/>
  <rect class="note" x="1475" y="440" width="185" height="76"/><text class="note-text" x="1485" y="458"><tspan x="1485">Publish after independent review</tspan><tspan x="1485" dy="15">under access, pricing, and</tspan><tspan x="1485" dy="15">licensing controls. No handoff</tspan><tspan x="1485" dy="15">reaches Workflow 05.</tspan></text><path class="assoc" d="M1632 415 V440"/>
</svg>
