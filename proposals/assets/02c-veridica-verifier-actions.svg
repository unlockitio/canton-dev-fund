<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">02C Veridica Verifier Actions</title>
<desc id="desc">Two-pool collaboration. Verifier Party pool (multiplicity 1..999, mutually exclusive with 02b aggregator) starts on Verifier_Authorized from the 02 chassis (external). The verifier waits via an event-based gateway for either Evidence_Resubmitted (from 02a contributor, external) or Verification_Request (from 02b aggregator, external). For individual verification, the verifier checks evidence (validation rules, independence, conflicts), then attests with limitations or challenges. For aggregate attestation, the verifier validates method (inputs, independence, evidence, confidence), then aggregate-attestation attests with limitations or aggregate-attestation challenges method or input. Results are sent to the Veridica Platform. The verifier loops back to wait for the next input. Exactly one boundary message catch exists, on the validate-method task, for governance suspension mid-verification. No message flow reaches 06 Reward Allocation or Process_AllocationEffector.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><style>.pool{fill:#fff;stroke:#0f172a;stroke-width:2}.external-pool{fill:#f8fafc;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 3}.task{fill:#fff;stroke:#1d4ed8;stroke-width:1.6}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.boundary{fill:#fff;stroke:#b91c1c;stroke-width:2}.end{stroke-width:4}.flow{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:7 4;marker-end:url(#message-arrow)}.t{font:11px sans-serif;fill:#0f172a}.s{font:10px sans-serif;fill:#334155}.poolname{font:bold 14px sans-serif;fill:#0f172a}.label{font:10px sans-serif;fill:#5b21b6}</style></defs>
<g id="DI_Chassis_External_02c"><rect class="external-pool" x="20" y="20" width="1540" height="50"/><text class="poolname" x="32" y="42">Participant lifecycle chassis (02, external source of Verifier_Authorized)</text></g>
<g id="DI_Aggregator_External"><rect class="external-pool" x="20" y="80" width="1540" height="50"/><text class="poolname" x="32" y="102">Aggregator Party (02b, external, mutually exclusive with 02c verifier)</text></g>
<g id="DI_Contributor_External"><rect class="external-pool" x="20" y="140" width="1540" height="50"/><text class="poolname" x="32" y="162">Contributor Party (02a, external source of Evidence_Resubmitted)</text></g>
<g id="DI_VeridicaPlatform_02c"><rect class="pool" x="20" y="210" width="1540" height="160"/><text class="poolname" x="32" y="232">Veridica Platform</text></g>
<g id="DI_VP_AttestationReceived"><circle class="event" cx="138" cy="270" r="18"/><text class="s" x="78" y="306">Verifier_Attestation received</text></g>
<g id="DI_VP_ChallengeReceived"><circle class="event" cx="138" cy="320" r="18"/><text class="s" x="78" y="356">Verifier_Challenge received</text></g>
<g id="DI_VP_RecordOutcome"><rect class="task" x="220" y="270" width="220" height="86" rx="8"/><text class="t" x="232" y="296">Record verifier attestation</text><text class="t" x="248" y="312">or challenge outcome</text><text class="t" x="252" y="336">(attestation or challenge)</text></g>
<g id="DI_VP_End"><circle class="event end" cx="498" cy="313" r="18"/><text class="s" x="438" y="349">Outcome recorded</text></g>
<g id="DI_Participant_Process_VerifierParty"><rect class="pool" x="20" y="390" width="1540" height="540"/><text class="poolname" x="32" y="412">Verifier Party (multiplicity 1..999, mutually exclusive with 02b aggregator)</text></g>
<g id="DI_VR_Authorized"><circle class="event" cx="138" cy="478" r="18"/><text class="s" x="78" y="514">Verifier_Authorized received</text></g>
<g id="DI_VR_WaitForInput"><polygon class="gateway" points="276,450 304,478 276,506 248,478" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><circle cx="276" cy="478" r="14" fill="none" stroke="#b45309" stroke-width="2"/><text class="s" x="180" y="430" text-anchor="middle">Wait for Evidence_Resubmitted</text><text class="s" x="200" y="444" text-anchor="middle">(02a) or Verification_Request (02b)</text></g>
<g id="DI_VR_EvidenceResubmittedReceived"><circle class="event" cx="358" cy="428" r="18"/><text class="s" x="298" y="464">Evidence_Resubmitted received</text></g>
<g id="DI_VR_CheckEvidence"><rect class="task" x="420" y="400" width="200" height="56" rx="8"/><text class="t" x="432" y="420">Check evidence:</text><text class="t" x="432" y="434">validation rules,</text><text class="t" x="436" y="448">independence, conflicts</text></g>
<g id="DI_VR_IndividualDecision"><polygon class="gateway" points="716,410 744,438 716,466 688,438" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><path d="M698,420L738,456M738,420L698,456" stroke="#b45309" stroke-width="2"/><text class="s" x="620" y="394" text-anchor="middle">Individual verification outcome</text></g>
<g id="DI_VR_AttestIndividual"><rect class="task" x="760" y="370" width="180" height="46" rx="8"/><text class="t" x="772" y="390">Attest with limitations</text><text class="t" x="796" y="406">(individual)</text></g>
<g id="DI_VR_AttestationSent"><circle class="event end" cx="998" cy="393" r="18"/><text class="s" x="938" y="429">Verifier_Attestation sent</text></g>
<g id="DI_VR_ChallengeIndividual"><rect class="task" x="760" y="460" width="180" height="46" rx="8"/><text class="t" x="772" y="480">Challenge or</text><text class="t" x="776" y="496">request evidence</text></g>
<g id="DI_VR_ChallengeSent"><circle class="event end" cx="998" cy="483" r="18"/><text class="s" x="938" y="519">Verifier_Challenge sent</text></g>
<g id="DI_VR_VerificationRequestReceived"><circle class="event" cx="358" cy="508" r="18"/><text class="s" x="298" y="544">Verification_Request received</text></g>
<g id="DI_VR_ValidateMethod"><rect class="task" x="420" y="480" width="200" height="56" rx="8"/><text class="t" x="432" y="500">Validate method:</text><text class="t" x="432" y="514">inputs, independence,</text><text class="t" x="436" y="528">evidence, confidence</text></g>
<g id="DI_VR_AggregateDecision"><polygon class="gateway" points="716,490 744,518 716,546 688,518" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><path d="M698,500L738,536M738,500L698,536" stroke="#b45309" stroke-width="2"/><text class="s" x="620" y="474" text-anchor="middle">Aggregate-attestation outcome</text></g>
<g id="DI_VR_AttestAggregate"><rect class="task" x="760" y="540" width="180" height="46" rx="8"/><text class="t" x="772" y="560">Attest with limitations</text><text class="t" x="792" y="576">(aggregate)</text></g>
<g id="DI_VR_AttestationSent2"><circle class="event end" cx="998" cy="563" r="18"/><text class="s" x="938" y="599">Verifier_Attestation sent</text></g>
<g id="DI_VR_ChallengeAggregate"><rect class="task" x="760" y="620" width="180" height="46" rx="8"/><text class="t" x="772" y="640">Challenge method</text><text class="t" x="792" y="656">or input</text></g>
<g id="DI_VR_ChallengeSent2"><circle class="event end" cx="998" cy="643" r="18"/><text class="s" x="938" y="679">Verifier_Challenge sent</text></g>
<g id="DI_VR_LoopBack"><polygon class="gateway" points="1140,500 1168,528 1140,556 1112,528" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text class="s" x="1100" y="484" text-anchor="middle">Loop back</text></g>
<g id="DI_VR_GovernanceInterruption"><circle class="boundary" cx="510" cy="568" r="18"/><text class="s" x="448" y="604">Governance suspension</text><text class="s" x="460" y="618">mid-verification</text></g>
<g id="DI_VR_ApplyInterruption"><rect class="task" x="420" y="700" width="200" height="46" rx="8"/><text class="t" x="440" y="720">Apply governance</text><text class="t" x="452" y="736">suspension</text></g>
<g id="DI_VR_Suspended"><circle class="event end" cx="678" cy="723" r="18"/><text class="s" x="618" y="759">Verifier suspended by governance</text></g>
