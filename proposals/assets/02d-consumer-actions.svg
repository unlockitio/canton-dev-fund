<g id="DI_CM_UseConfirmationRequestedReceived"><circle class="event" cx="1458" cy="678" r="18"/><text class="s" x="1398" y="714">Use_Confirmation_Requested</text><text class="s" x="1410" y="728">received</text></g>
<g id="DI_CM_ConfirmUsage"><rect class="task" x="1280" y="700" width="140" height="56" rx="8"/><text class="t" x="1292" y="720">Confirm usage</text><text class="t" x="1304" y="734">or reuse record</text></g>
