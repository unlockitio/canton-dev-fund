<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000" role="img" aria-labelledby="title desc">
<title id="title">02D Veridica Consumer Actions</title>
<desc id="desc">Three-pool collaboration. Consumer Party (single instance) starts on Consumer_Authorized from the 02 chassis (external). The consumer discovers the privacy-safe catalog (published by Contributor or Product Publisher, multiplicity 1..999), selects a direct or aggregate product, submits credential, purpose, and access request to the Veridica Platform. The platform checks credential, purpose, policy, and permission, then applies pricing and licensing (granted) or records denial reason (denied), and sends Access_Granted or Access_Denied. The consumer waits via an event-based gateway, then routes through the AC_C_Result exclusive gateway (presentation-layer path) to either record denied outcome or proceed to the AC_C_Path exclusive gateway (presentation-layer path) which selects normal Daml stakeholder/observer visibility or Explicit Contract Disclosure. The consumer uses the product for the approved purpose, receives Use_Confirmation_Requested, confirms usage or reuse, and sends Use_Confirmation. Exactly one boundary message catch exists, on the use-product task, for governance suspension mid-use. No message flow reaches 06 Reward Allocation or Process_AllocationEffector.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><style>.pool{fill:#fff;stroke:#0f172a;stroke-width:2}.external-pool{fill:#f8fafc;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 3}.task{fill:#fff;stroke:#1d4ed8;stroke-width:1.6}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.boundary{fill:#fff;stroke:#b91c1c;stroke-width:2}.end{stroke-width:4}.flow{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:7 4;marker-end:url(#message-arrow)}.t{font:11px sans-serif;fill:#0f172a}.s{font:10px sans-serif;fill:#334155}.poolname{font:bold 14px sans-serif;fill:#0f172a}.label{font:10px sans-serif;fill:#5b21b6}</style></defs>
<g id="DI_Chassis_External_02d"><rect class="external-pool" x="20" y="20" width="1640" height="50"/><text class="poolname" x="32" y="42">Participant lifecycle chassis (02, external source of Consumer_Authorized)</text></g>
<g id="DI_VeridicaPlatform_02d"><rect class="pool" x="20" y="90" width="1640" height="280"/><text class="poolname" x="32" y="112">Veridica Platform</text></g>
