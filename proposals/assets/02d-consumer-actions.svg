<g id="DI_VP_ApplyPricing"><rect class="task" x="560" y="150" width="200" height="46" rx="8"/><text class="t" x="572" y="170">Apply product pricing</text><text class="t" x="600" y="186">and licensing</text></g>
<g id="DI_VP_AccessGrantedSent"><circle class="event end" cx="818" cy="173" r="18"/><text class="s" x="758" y="209">Access_Granted sent</text></g>
<g id="DI_VP_RecordDenial"><rect class="task" x="560" y="220" width="200" height="46" rx="8"/><text class="t" x="572" y="240">Record denial reason</text><text class="t" x="600" y="256">(for Access_Denied)</text></g>
<g id="DI_VP_AccessDeniedSent"><circle class="event end" cx="818" cy="243" r="18"/><text class="s" x="758" y="279">Access_Denied sent</text></g>
<g id="DI_VP_UseConfirmationRequestedSent"><circle class="event end" cx="818" cy="303" r="18"/><text class="s" x="758" y="339">Use_Confirmation_Requested sent</text></g>
<g id="DI_VP_UseConfirmationReceived"><circle class="event" cx="918" cy="218" r="18"/><text class="s" x="858" y="254">Use_Confirmation received</text></g>
<g id="DI_VP_RecordUsage"><rect class="task" x="980" y="190" width="200" height="56" rx="8"/><text class="t" x="992" y="210">Record permitted</text><text class="t" x="1004" y="224">usage or reuse</text></g>
<g id="DI_VP_End"><circle class="event end" cx="1220" cy="218" r="18"/><text class="s" x="1160" y="254">Consumer round complete</text></g>
<g id="DI_Participant_Process_ConsumerParty"><rect class="pool" x="20" y="390" width="1640" height="440"/><text class="poolname" x="32" y="412">Consumer Party (single instance)</text></g>
