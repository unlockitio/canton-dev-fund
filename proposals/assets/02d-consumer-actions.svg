<g id="DI_CM_AccessGrantedReceived"><circle class="event" cx="1178" cy="428" r="18"/><text class="s" x="1118" y="464">Access_Granted received</text></g>
<g id="DI_CM_AccessDeniedReceived"><circle class="event" cx="1178" cy="528" r="18"/><text class="s" x="1118" y="564">Access_Denied received</text></g>
<g id="DI_CM_Result"><polygon class="gateway" points="1296,450 1324,478 1296,506 1268,478" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><path d="M1278,460L1318,496M1318,460L1278,496" stroke="#b45309" stroke-width="2"/><text class="s" x="1220" y="434" text-anchor="middle">AC_C_Result:</text><text class="s" x="1220" y="448" text-anchor="middle">access result (presentation path)</text></g>
<g id="DI_CM_RecordDenied"><rect class="task" x="1240" y="490" width="180" height="46" rx="8"/><text class="t" x="1252" y="510">Record denied</text><text class="t" x="1268" y="526">access outcome</text></g>
<g id="DI_CM_DeniedEnd"><circle class="event end" cx="1460" cy="513" r="18"/><text class="s" x="1400" y="549">Access denied; round complete</text></g>
<g id="DI_CM_Path"><polygon class="gateway" points="1396,420 1424,448 1396,476 1368,448" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><path d="M1378,430L1418,466M1418,430L1378,466" stroke="#b45309" stroke-width="2"/><text class="s" x="1320" y="404" text-anchor="middle">AC_C_Path:</text><text class="s" x="1310" y="418" text-anchor="middle">presentation path</text></g>
<g id="DI_CM_UseNormalVisibility"><rect class="task" x="1440" y="390" width="180" height="46" rx="8"/><text class="t" x="1452" y="410">Use normal Daml</text><text class="t" x="1452" y="426">stakeholder or observer visibility</text></g>
