<g id="DI_CM_UseMerge"><polygon class="gateway" points="1396,580 1424,608 1396,636 1368,608" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text class="s" x="1320" y="564" text-anchor="middle">merge</text></g>
