<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1640" viewBox="0 0 1600 1640" role="img" aria-labelledby="title desc">
<title id="title">02 Veridica Ongoing Participant Lifecycle</title>
<desc id="desc">Five-pool collaboration. The Veridica Platform pool (chassis) references the Active Governance Mechanism data object — a version-pinned CAP mechanism (ballot, resolution, verification rules) issued by 01B governance — and uses it to admit, suspend, remove or rotate participants as contributors, aggregators, verifiers or consumers. The four role-party pools (multiplicity 1..999 each) are instantiated implicitly via the chassis delivery message flows. Exactly one boundary message catch exists, on the chassis execute task, used for governance-mandated interruption. No message flow reaches 05 Reward Allocation. No exclusive gateway branches initial versus correction.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><marker id="assoc-arrow" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto"><path d="M8 0L0 4L8 8" fill="none" stroke="#0f766e" stroke-width="1.4"/></marker><style>.pool{fill:#fff;stroke:#0f172a;stroke-width:2}.task{fill:#fff;stroke:#1d4ed8;stroke-width:1.6}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.boundary{fill:#fff;stroke:#b91c1c;stroke-width:2}.end{stroke-width:4}.flow{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:7 4;marker-end:url(#message-arrow)}.assoc{fill:none;stroke:#0f766e;stroke-width:1.4;stroke-dasharray:3 3;marker-end:url(#assoc-arrow)}.dataobject{fill:#fef9c3;stroke:#854d0e;stroke-width:1.4}.t{font:12px sans-serif;fill:#0f172a}.s{font:10.5px sans-serif;fill:#334155}.poolname{font:bold 14px sans-serif;fill:#0f172a}.label{font:10px sans-serif;fill:#5b21b6}.doname{font:bold 12px sans-serif;fill:#854d0e}</style></defs>
<g id="DI_Participant_VeridicaPlatform"><rect class="pool" x="20" y="20" width="1540" height="580"/><text class="poolname" x="32" y="45">Veridica Platform (chassis)</text></g>
<g id="DI_DataObject_ActiveMechanism"><rect class="dataobject" x="40" y="80" width="220" height="60" rx="6"/><text class="doname" x="56" y="106">Active Governance Mechanism</text><text class="s" x="56" y="125">CAP ballot, resolution, verification</text></g>
<g id="DI_VP_DecisionReceived"><circle class="event" cx="138" cy="238" r="18"/><text class="s" x="100" y="282">Access request received</text></g>
<g id="DI_VP_Validate"><rect class="task" x="220" y="200" width="220" height="76" rx="8"/><text class="t" x="234" y="226">Validate request against</text><text class="t" x="234" y="244">active governance mechanism</text></g>
<g id="DI_VP_Execute"><rect class="task" x="480" y="200" width="220" height="76" rx="8"/><text class="t" x="494" y="226">Execute chassis action:</text><text class="t" x="494" y="244">admit, assign role, suspend,</text><text class="t" x="494" y="262">remove, or rotate credential</text></g>
<g id="DI_VP_GovernanceInterruption"><circle class="boundary" cx="570" cy="308" r="18"/><text class="s" x="500" y="346">Governance-mandated interruption</text></g>
<g id="DI_VP_ApplyInterruption"><rect class="task" x="480" y="360" width="220" height="76" rx="8"/><text class="t" x="494" y="386">Apply governance-mandated</text><text class="t" x="494" y="404">suspension, rotation, or decommission</text></g>
<g id="DI_VP_NotifyInterruption"><rect class="task" x="740" y="360" width="200" height="76" rx="8"/><text class="t" x="754" y="386">Notify role party of</text><text class="t" x="754" y="404">governance-mandated interruption</text></g>
<g id="DI_VP_NotifyInterruptionSent"><circle class="event end" cx="998" cy="390" r="18"/><text class="s" x="938" y="428">Governance interruption delivery sent</text></g>
<g id="DI_VP_AuditInterruption"><rect class="task" x="1060" y="360" width="180" height="76" rx="8"/><text class="t" x="1074" y="394">Audit governance-mandated</text><text class="t" x="1074" y="412">interruption</text></g>
<g id="DI_VP_Decommissioned"><circle class="event end" cx="1298" cy="390" r="18"/><text class="s" x="1232" y="428">Decommissioned by governance</text></g>
<g id="DI_VP_Notify"><rect class="task" x="740" y="200" width="200" height="76" rx="8"/><text class="t" x="754" y="226">Notify role party of</text><text class="t" x="754" y="244">chassis action outcome</text><text class="t" x="754" y="262">(admit, assign, suspend, remove, rotate)</text></g>
<g id="DI_VP_NotifySent"><circle class="event end" cx="998" cy="236" r="18"/><text class="s" x="938" y="272">Chassis delivery sent</text></g>
<g id="DI_VP_End"><circle class="event end" cx="1098" cy="236" r="18"/><text class="s" x="1046" y="272">Chassis action complete</text></g>
<path id="DI_Assoc_MechanismToValidate" class="assoc" d="M260,140L260,200"/>
<path id="DI_VP1" class="flow" d="M156,238L220,238"/><path id="DI_VP2" class="flow" d="M440,238L480,238"/><path id="DI_VP3" class="flow" d="M700,238L740,238"/><path id="DI_VP4" class="flow" d="M940,238L980,238"/><path id="DI_VP5" class="flow" d="M1016,238L1080,238"/>
<path id="DI_VP_BI1" class="flow" d="M570,326L570,360"/><path id="DI_VP_BI2" class="flow" d="M700,398L740,398"/><path id="DI_VP_BI3" class="flow" d="M940,398L980,398"/><path id="DI_VP_BI4" class="flow" d="M1016,390L1060,390"/><path id="DI_VP_BI5" class="flow" d="M1240,390L1280,390"/>
<g id="DI_Participant_Process_ContributorParty"><rect class="pool" x="20" y="640" width="1540" height="220"/><text class="poolname" x="32" y="665">Contributor Party (multiplicity 1..999)</text></g>
<g id="DI_CP_ChassisDeliveryReceived"><circle class="event" cx="218" cy="748" r="18"/><text class="s" x="158" y="792">Chassis lifecycle delivery received</text></g>
<g id="DI_CP_ApplyDelivery"><rect class="task" x="300" y="720" width="280" height="56" rx="8"/><text class="t" x="314" y="744">Apply chassis action as Contributor</text><text class="t" x="332" y="760">per active governance mechanism</text></g>
<g id="DI_CP_End"><circle class="event end" cx="658" cy="748" r="18"/><text class="s" x="596" y="782">Contributor lifecycle stage complete</text></g>
<path id="DI_CP1" class="flow" d="M236,748L300,748"/><path id="DI_CP2" class="flow" d="M580,748L640,748"/>
<g id="DI_Participant_Process_AggregatorParty"><rect class="pool" x="20" y="880" width="1540" height="220"/><text class="poolname" x="32" y="905">Aggregator Party (multiplicity 1..999)</text></g>
<g id="DI_AG_ChassisDeliveryReceived"><circle class="event" cx="218" cy="988" r="18"/><text class="s" x="158" y="1032">Chassis lifecycle delivery received</text></g>
<g id="DI_AG_ApplyDelivery"><rect class="task" x="300" y="960" width="280" height="56" rx="8"/><text class="t" x="314" y="984">Apply chassis action as Aggregator</text><text class="t" x="332" y="1000">per active governance mechanism</text></g>
<g id="DI_AG_End"><circle class="event end" cx="658" cy="988" r="18"/><text class="s" x="596" y="1022">Aggregator lifecycle stage complete</text></g>
<path id="DI_AG1" class="flow" d="M236,988L300,988"/><path id="DI_AG2" class="flow" d="M580,988L640,988"/>
<g id="DI_Participant_Process_VerifierParty"><rect class="pool" x="20" y="1120" width="1540" height="220"/><text class="poolname" x="32" y="1145">Verifier Party (multiplicity 1..999)</text></g>
<g id="DI_VR_ChassisDeliveryReceived"><circle class="event" cx="218" cy="1228" r="18"/><text class="s" x="158" y="1272">Chassis lifecycle delivery received</text></g>
<g id="DI_VR_ApplyDelivery"><rect class="task" x="300" y="1200" width="280" height="56" rx="8"/><text class="t" x="314" y="1224">Apply chassis action as Verifier</text><text class="t" x="332" y="1240">per active governance mechanism</text></g>
<g id="DI_VR_End"><circle class="event end" cx="658" cy="1228" r="18"/><text class="s" x="596" y="1262">Verifier lifecycle stage complete</text></g>
<path id="DI_VR1" class="flow" d="M236,1228L300,1228"/><path id="DI_VR2" class="flow" d="M580,1228L640,1228"/>
<g id="DI_Participant_Process_ConsumerParty"><rect class="pool" x="20" y="1360" width="1540" height="220"/><text class="poolname" x="32" y="1385">Consumer Party (multiplicity 1..999)</text></g>
<g id="DI_CS_ChassisDeliveryReceived"><circle class="event" cx="218" cy="1468" r="18"/><text class="s" x="158" y="1512">Chassis lifecycle delivery received</text></g>
<g id="DI_CS_ApplyDelivery"><rect class="task" x="300" y="1440" width="280" height="56" rx="8"/><text class="t" x="314" y="1464">Apply chassis action as Consumer</text><text class="t" x="332" y="1480">per active governance mechanism</text></g>
<g id="DI_CS_End"><circle class="event end" cx="658" cy="1468" r="18"/><text class="s" x="596" y="1502">Consumer lifecycle stage complete</text></g>
<path id="DI_CS1" class="flow" d="M236,1468L300,1468"/><path id="DI_CS2" class="flow" d="M580,1468L640,1468"/>
<path id="DI_MF_ChassisDelivery_Contributor" class="message" d="M998,254L998,300L1340,300L1340,850L236,850L236,766"/><text class="label" x="1100" y="295">Chassis lifecycle delivery</text>
<path id="DI_MF_ChassisDelivery_Aggregator" class="message" d="M998,254L998,310L1350,310L1350,1090L236,1090L236,1006"/><text class="label" x="1110" y="345">Chassis lifecycle delivery</text>
<path id="DI_MF_ChassisDelivery_Verifier" class="message" d="M998,254L998,320L1360,320L1360,1330L236,1330L236,1246"/><text class="label" x="1120" y="395">Chassis lifecycle delivery</text>
<path id="DI_MF_ChassisDelivery_Consumer" class="message" d="M998,254L998,330L1370,330L1370,1570L236,1570L236,1486"/><text class="label" x="1130" y="445">Chassis lifecycle delivery</text>
</svg>
