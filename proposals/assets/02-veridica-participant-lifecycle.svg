<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1860" viewBox="0 0 1600 1860" role="img" aria-labelledby="title desc">
<title id="title">02 Veridica Ongoing Participant Lifecycle</title>
<desc id="desc">Six-pool collaboration. The Veridica Platform pool owns the chassis for admission, role assignment, suspension, removal, and credential rotation. Each role-party pool (Contributor, Aggregator, Verifier, Consumer, multiplicity 1..999) is instantiated by a message start on role-binding authorization issued by 01B governance (external). The Veridica Platform sends in-flight chassis lifecycle delivery to each role party via an intermediate message throw caught by intermediate message catch on the role-party side. Exactly one boundary message catch exists, on the chassis execute task, used for governance-mandated interruption (suspension, rotation, decommission). No message flow reaches 06 Reward Allocation. No exclusive gateway branches initial versus correction.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><marker id="message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><style>.pool{fill:#fff;stroke:#0f172a;stroke-width:2}.external-pool{fill:#f8fafc;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 3}.task{fill:#fff;stroke:#1d4ed8;stroke-width:1.6}.event{fill:#fff;stroke:#0f766e;stroke-width:2}.boundary{fill:#fff;stroke:#b91c1c;stroke-width:2}.end{stroke-width:4}.flow{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}.message{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:7 4;marker-end:url(#message-arrow)}.t{font:12px sans-serif;fill:#0f172a}.s{font:10.5px sans-serif;fill:#334155}.poolname{font:bold 14px sans-serif;fill:#0f172a}.label{font:10px sans-serif;fill:#5b21b6}</style></defs>
<g id="DI_Governance_External"><rect class="external-pool" x="20" y="20" width="1540" height="80"/><text class="poolname" x="32" y="45">Consortium Governance (01B, external source of role-binding authorizations)</text></g>
<g id="DI_VeridicaPlatform"><rect class="pool" x="20" y="120" width="1540" height="560"/><text class="poolname" x="32" y="145">Veridica Platform (chassis)</text></g>
<g id="DI_Participant_Process_ContributorParty"><rect class="pool" x="20" y="700" width="1540" height="260"/><text class="poolname" x="32" y="725">Contributor Party (multiplicity 1..999)</text></g>
<g id="DI_Participant_Process_AggregatorParty"><rect class="pool" x="20" y="980" width="1540" height="260"/><text class="poolname" x="32" y="1005">Aggregator Party (multiplicity 1..999)</text></g>
<g id="DI_Participant_Process_VerifierParty"><rect class="pool" x="20" y="1260" width="1540" height="260"/><text class="poolname" x="32" y="1285">Verifier Party (multiplicity 1..999)</text></g>
<g id="DI_Participant_Process_ConsumerParty"><rect class="pool" x="20" y="1540" width="1540" height="260"/><text class="poolname" x="32" y="1565">Consumer Party (multiplicity 1..999)</text></g>
<g id="DI_VP_DecisionReceived"><circle class="event" cx="138" cy="218" r="18"/><text class="s" x="98" y="262">Lifecycle decision received</text></g>
<g id="DI_VP_Validate"><rect class="task" x="220" y="190" width="160" height="56" rx="8"/><text class="t" x="234" y="216">Validate bounded decision</text><text class="t" x="248" y="232">version and authorization</text></g>
<g id="DI_VP_Execute"><rect class="task" x="420" y="190" width="200" height="56" rx="8"/><text class="t" x="430" y="208">Execute chassis action:</text><text class="t" x="430" y="222">admit, assign role, suspend,</text><text class="t" x="430" y="236">remove, or rotate credential</text></g>
<g id="DI_VP_GovernanceInterruption"><circle class="boundary" cx="510" cy="278" r="18"/><text class="s" x="455" y="316">Governance-mandated interruption</text></g>
<g id="DI_VP_ApplyInterruption"><rect class="task" x="420" y="330" width="200" height="56" rx="8"/><text class="t" x="432" y="354">Apply governance-mandated</text><text class="t" x="442" y="370">suspension, rotation, or decommission</text></g>
<g id="DI_VP_NotifyInterruption"><rect class="task" x="680" y="330" width="180" height="56" rx="8"/><text class="t" x="690" y="354">Notify role party of</text><text class="t" x="690" y="370">governance-mandated interruption</text></g>
<g id="DI_VP_NotifyInterruptionSent"><circle class="event end" cx="918" cy="358" r="18"/><text class="s" x="858" y="396">Governance interruption delivery sent</text></g>
<g id="DI_VP_AuditInterruption"><rect class="task" x="980" y="330" width="160" height="56" rx="8"/><text class="t" x="990" y="354">Audit governance-mandated</text><text class="t" x="1010" y="370">interruption</text></g>
<g id="DI_VP_Decommissioned"><circle class="event end" cx="1198" cy="358" r="18"/><text class="s" x="1138" y="396">Decommissioned by governance</text></g>
<g id="DI_VP_Notify"><rect class="task" x="680" y="190" width="180" height="56" rx="8"/><text class="t" x="694" y="208">Notify role party of</text><text class="t" x="704" y="222">chassis action outcome</text><text class="t" x="718" y="236">(admit, assign, suspend, remove, rotate)</text></g>
<g id="DI_VP_NotifySent"><circle class="event end" cx="918" cy="218" r="18"/><text class="s" x="858" y="254">Chassis delivery sent</text></g>
<g id="DI_VP_End"><circle class="event end" cx="1018" cy="218" r="18"/><text class="s" x="966" y="254">Chassis action complete</text></g>
<g id="DI_CP_RoleBindingReceived"><circle class="event" cx="218" cy="838" r="18"/><text class="s" x="158" y="882">Role-binding authorization received</text></g>
<g id="DI_CP_Apply"><rect class="task" x="300" y="810" width="200" height="56" rx="8"/><text class="t" x="316" y="834">Apply Contributor role</text><text class="t" x="328" y="850">and register Daml party</text></g>
<g id="DI_CP_ChassisDeliveryReceived"><circle class="event" cx="578" cy="838" r="18"/><text class="s" x="518" y="882">Chassis lifecycle delivery received</text></g>
<g id="DI_CP_ApplyDelivery"><rect class="task" x="660" y="810" width="220" height="56" rx="8"/><text class="t" x="674" y="834">Apply suspension, removal,</text><text class="t" x="680" y="850">or credential rotation per delivery</text></g>
<g id="DI_CP_End"><circle class="event end" cx="958" cy="838" r="18"/><text class="s" x="896" y="872">Contributor lifecycle stage complete</text></g>
<g id="DI_AG_RoleBindingReceived"><circle class="event" cx="218" cy="1118" r="18"/><text class="s" x="158" y="1162">Role-binding authorization received</text></g>
<g id="DI_AG_Apply"><rect class="task" x="300" y="1090" width="200" height="56" rx="8"/><text class="t" x="316" y="1114">Apply Aggregator role</text><text class="t" x="328" y="1130">and register Daml party</text></g>
<g id="DI_AG_ChassisDeliveryReceived"><circle class="event" cx="578" cy="1118" r="18"/><text class="s" x="518" y="1162">Chassis lifecycle delivery received</text></g>
<g id="DI_AG_ApplyDelivery"><rect class="task" x="660" y="1090" width="220" height="56" rx="8"/><text class="t" x="674" y="1114">Apply suspension, removal,</text><text class="t" x="680" y="1130">or credential rotation per delivery</text></g>
<g id="DI_AG_End"><circle class="event end" cx="958" cy="1118" r="18"/><text class="s" x="896" y="1152">Aggregator lifecycle stage complete</text></g>
<g id="DI_VR_RoleBindingReceived"><circle class="event" cx="218" cy="1398" r="18"/><text class="s" x="158" y="1442">Role-binding authorization received</text></g>
<g id="DI_VR_Apply"><rect class="task" x="300" y="1370" width="200" height="56" rx="8"/><text class="t" x="316" y="1394">Apply Verifier role</text><text class="t" x="328" y="1410">and register Daml party</text></g>
<g id="DI_VR_ChassisDeliveryReceived"><circle class="event" cx="578" cy="1398" r="18"/><text class="s" x="518" y="1442">Chassis lifecycle delivery received</text></g>
<g id="DI_VR_ApplyDelivery"><rect class="task" x="660" y="1370" width="220" height="56" rx="8"/><text class="t" x="674" y="1394">Apply suspension, removal,</text><text class="t" x="680" y="1410">or credential rotation per delivery</text></g>
<g id="DI_VR_End"><circle class="event end" cx="958" cy="1398" r="18"/><text class="s" x="896" y="1432">Verifier lifecycle stage complete</text></g>
<g id="DI_CS_RoleBindingReceived"><circle class="event" cx="218" cy="1678" r="18"/><text class="s" x="158" y="1722">Role-binding authorization received</text></g>
<g id="DI_CS_Apply"><rect class="task" x="300" y="1650" width="200" height="56" rx="8"/><text class="t" x="316" y="1674">Apply Consumer role</text><text class="t" x="328" y="1690">and register Daml party</text></g>
<g id="DI_CS_ChassisDeliveryReceived"><circle class="event" cx="578" cy="1678" r="18"/><text class="s" x="518" y="1722">Chassis lifecycle delivery received</text></g>
<g id="DI_CS_ApplyDelivery"><rect class="task" x="660" y="1650" width="220" height="56" rx="8"/><text class="t" x="674" y="1674">Apply suspension, removal,</text><text class="t" x="680" y="1690">or credential rotation per delivery</text></g>
<g id="DI_CS_End"><circle class="event end" cx="958" cy="1678" r="18"/><text class="s" x="896" y="1712">Consumer lifecycle stage complete</text></g>
